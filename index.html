function hashSeed(str){let h=2166136261>>>0;for(const ch of String(str)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function makeBoards(){let cells=[];for(let q=-3;q<=3;q++)for(let r=Math.max(-3,-q-3);r<=Math.min(3,-q+3);r++)cells.push({q,r});return cells}

function setupGame(seed){S={version:'Alpha v0.9',buildId:'web-d9-dual-tech',contentVersion:'v1.0',techPhasePatch:'dual-research-v0.1',seed,rngState:hashSeed(seed),round:1,status:'setup',eventId:0,events:[],errors:[],players:[newPlayer('human','你',0),newPlayer('ai1','AI 1',1),newPlayer('ai2','AI 2',2)],fixedOrder:['human','ai1','ai2'],currentPhase:null,pending:{},revealed:{},selected:[],control:null};
 for(const p of S.players)p.board[key(0,0)]={uid:'EXTRACT-'+p.id,type:'Production',element:'Extraction',name:'元素汲取井'};
 const all=buildTileDeck(); S.tileDecks={T1:shuffle(all.filter(x=>x.tier===1)),T2:shuffle(all.filter(x=>x.tier===2))}; S.tileMarkets={T1:S.tileDecks.T1.splice(0,3),T2:S.tileDecks.T2.splice(0,3)};

function player(id){return S.players.find(p=>p.id===id)} function spellDef(uid){return CONTENT.spells.find(s=>s._uid===uid)} function techDef(id){return CONTENT.techs.find(t=>t.id===id)}
async function setupStartingSpells(){for(const pid of S.fixedOrder){let p=player(pid),draw=S.spellDecks.T1.splice(0,Math.min(2,S.spellDecks.T1.length));let idx=0;if(pid==='human')idx=await chooseCards('選擇你的起始術式',draw.map(s=>spellCardHtml(s)),draw.map((_,i)=>i),true);else idx=aiSpellChoice(p,draw);let chosen=draw[idx];p.spells.push({uid:chosen._uid,level:1});draw.forEach((s,i)=>{if(i!==idx)S.spellDecks.T1.push(s)});log('starting_spell',p.name+' 取得 '+chosen.name,{playerId:pid,drawn:draw.map(x=>x._uid),kept:chosen._uid});}

async function phaseSelection(){if(S.status!=='phase_selection')return;S.pending={};let human=await choosePhaseHuman();S.pending.human=human;for(const pid of ['ai1','ai2'])S.pending[pid]=aiChoosePhase(player(pid));S.revealed=clone(S.pending);S.selected=PHASES.filter(ph=>Object.values(S.revealed).some(x=>x.phase===ph));for(const p of S.players)p.phaseHistory.push(S.revealed[p.id].phase);log('phase_reveal','揭露本輪 Phase',clone(S.revealed));S.status='resolving';render();await resolveNextPhase();}
async function choosePhaseHuman(){let opts=[];for(const ph of PHASES)for(const pr of PRIV[ph])opts.push({phase:ph,privilege:pr});let idx=await chooseCards('Round '+S.round+'：選擇 Phase + Privilege',opts.map(o=>`<b>${o.phase}</b><br><span class=small>${o.privilege}</span>`),opts.map((_,i)=>i),true);return opts[idx]}
function aiChoosePhase(p){let scores=PHASES.map(ph=>[ph,aiPhaseScore(p,ph)]).sort((a,b)=>b[1]-a[1]||PHASES.indexOf(a[0])-PHASES.indexOf(b[0]));let ph=scores[0][0],pr=PRIV[ph][0];if(ph==='Build')pr=p.gold<3?'Discount':'Expansion';if(ph==='Study')pr=p.spells.some(s=>s.level<3)&&p.spells.length>=3?'Upgrade':'Search';if(ph==='Funding')pr=p.hand.length<3&&rng()<.25?'Procurement':'Financing';return{phase:ph,privilege:pr}}
function aiPhaseScore(p,ph){let r=S.round,score=0;if(ph==='Funding')score=4+(p.gold<4?7:0);if(ph==='Build')score=6+(p.hand.length?3:0)+(r<8?3:0);if(ph==='Study')score=5+(p.spells.length<4?4:0)+(r>5?2:0);if(ph==='Tech')score=3+(r>2&&r<10?4:0);if(ph==='Production')score=calcProd(p).value+(r>4?4:0);return score}
async function resolveNextPhase(){let idx=PHASES.indexOf(S.currentPhase);let candidates=S.selected.filter(ph=>PHASES.indexOf(ph)>idx);if(!candidates.length){S.currentPhase=null;S.status='round_end_spell';render();return roundEndSpellWindow()}S.currentPhase=candidates[0];render();let order=publicOrder();log('phase_start',S.currentPhase+' 開始',{order});if(S.currentPhase==='Funding')await resolveFunding(order);if(S.currentPhase==='Build')await resolveBuild(order);if(S.currentPhase==='Study')await resolveStudy(order);if(S.currentPhase==='Tech')await resolveTech(order);if(S.currentPhase==='Production')await resolveProduction(order);log('phase_end',S.currentPhase+' 結束');return resolveNextPhase()}

async function resolveFunding(order){for(const p of S.players){p.gold+=2;let choice=S.revealed[p.id];if(choice.phase==='Funding'&&choice.privilege==='Financing')p.gold+=3;if(p.generic.includes('G05'))p.gold+=choice.phase==='Funding'?2:1;log('funding',p.name+' Funding 收入',{gold:p.gold})}for(const pid of order){let p=player(pid),c=S.revealed[pid];if(c.phase==='Funding'&&c.privilege==='Procurement')await procurement(p)}}
async function procurement(p){if(p.hand.length>=handLimit(p))return;let tier=p.id==='human'?await chooseSimple('Procurement 指定 Tier',['T1','T2']):((p.spells.some(s=>spellDef(s.uid).tier===2))?'T2':'T1');let deck=S.tileDecks[tier],n=p.generic.includes('G06')?5:3,draw=deck.splice(0,Math.min(n,deck.length));if(!draw.length)return;let idx=p.id==='human'?await chooseCards('Procurement 選 1',draw.map(tileHtml),draw.map((_,i)=>i),true):aiTileChoice(p,draw);p.hand.push(draw[idx]);draw.forEach((t,i)=>{if(i!==idx)deck.push(t)});shuffle(deck);log('procurement',p.name+' 採購 '+draw[idx].name,{drawn:draw.map(x=>x.uid),kept:draw[idx].uid})}

async function resolveBuild(order){for(const p of S.players){p.round.builtThisPhase=0;p.round.firstProdBuilt=false;p.round.firstElementBuilt=false}for(const pid of order){let p=player(pid);if(p.breakTech.includes('E07'))await e07Entry(p)}let expand=order.filter(id=>S.revealed[id].phase==='Build'&&S.revealed[id].privilege==='Expansion');for(const pid of expand)await buildControl(player(pid),1,'Expansion pre');for(const pid of order.filter(id=>!expand.includes(id)))await buildControl(player(pid),1,'Normal');for(const pid of expand)await buildControl(player(pid),1,'Expansion post');for(const pid of order)await buildFromHandLoop(player(pid))}

async function humanAcquire(p,label){let acts=['Pass'];if(p.hand.length<handLimit(p)){acts.push('Blind T1','Blind T2')}for(let i=0;i<S.tileMarkets.T1.length;i++)if(S.tileMarkets.T1[i])acts.push('T1#'+i);for(let i=0;i<S.tileMarkets.T2.length;i++)if(S.tileMarkets.T2[i])acts.push('T2#'+i);let labels=acts.map(a=>{if(a==='Pass')return 'Pass';if(a==='Blind T1')return '盲抽 T1';if(a==='Blind T2')return '盲抽 T2';let [tier,si]=a.split('#'),t=S.tileMarkets[tier][+si];return t?`公開 ${tier}：${t.name}`:`公開 ${tier}：空槽`});let choice=await chooseSimple(label+'：取得機會',labels);let a=acts[choice];if(a==='Pass')return;if(a.startsWith('Blind')){let tier=a.endsWith('T1')?'T1':'T2';if(p.hand.length<handLimit(p)&&S.tileDecks[tier].length){let t=S.tileDecks[tier].shift();p.hand.push(t);log('acquire',p.name+' 盲抽 '+t.name,{tier})}}else{let [tier,si]=a.split('#');await acquirePublic(p,tier,+si)}}
async function acquirePublic(p,tier,idx){let t=S.tileMarkets[tier][idx];if(!t)return;if(p.hand.length<handLimit(p)){p.hand.push(t);let refill=S.tileDecks[tier].shift()||null;S.tileMarkets[tier][idx]=refill;log('acquire',p.name+' 取得 '+t.name,{tier,idx,removedUid:t.uid,refill:refill?{uid:refill.uid,name:refill.name}:null});render()}else{let legal=legalPlacements(p,t);if(!legal.length)return;let can=canPayGold(p,buildCost(p,t));if(!can)return;let pos=p.id==='human'?await choosePlacement(p,t,legal):aiPlacement(p,t,legal);if(!pos)return;let refill=S.tileDecks[tier].shift()||null;S.tileMarkets[tier][idx]=refill;log('market_refill','公開 '+tier+'：'+t.name+' 被取得，補入 '+(refill?refill.name:'空槽'),{tier,idx,removedUid:t.uid,refillUid:refill&&refill.uid});render();await doBuild(p,t,pos,true)}}
function aiAcquire(p){let candidates=[];for(const tier of ['T1','T2'])S.tileMarkets[tier].forEach((t,i)=>{if(t)candidates.push({tier,i,t,score:aiTileScore(p,t)})});candidates.sort((a,b)=>b.score-a.score);let c=candidates[0];if(c&&p.hand.length<handLimit(p)){p.hand.push(c.t);let refill=S.tileDecks[c.tier].shift()||null;S.tileMarkets[c.tier][c.i]=refill;log('ai_acquire',p.name+' 取得 '+c.t.name,{score:c.score,tier:c.tier,idx:c.i,removedUid:c.t.uid,refill:refill?{uid:refill.uid,name:refill.name}:null});render()}else if(p.hand.length<handLimit(p)){let tier='T1';if(S.tileDecks[tier].length){let t=S.tileDecks[tier].shift();p.hand.push(t);log('ai_acquire',p.name+' 盲抽 '+t.name,{tier,uid:t.uid});render()}}}
async function buildFromHandLoop(p){let safety=0;while(p.hand.length&&safety++<10){let buildable=p.hand.map((t,i)=>({t,i,legal:legalPlacements(p,t),cost:buildCost(p,t)})).filter(x=>x.legal.length&&canPayGold(p,x.cost));if(!buildable.length)break;if(p.id==='human'){let opts=['完成 Build'].concat(buildable.map(x=>`${x.t.name}｜${x.cost}G`));let c=await chooseSimple('從手牌建造（可多次）',opts);if(c===0)break;let x=buildable[c-1];let pos=await choosePlacement(p,x.t,x.legal);if(!pos)break;p.hand.splice(x.i,1);await doBuild(p,x.t,pos,false)}else{let x=buildable.sort((a,b)=>aiTileScore(p,b.t)-aiTileScore(p,a.t))[0];let pos=aiPlacement(p,x.t,x.legal);p.hand.splice(x.i,1);await doBuild(p,x.t,pos,false)}}}
function buildCost(p,t){let raw=t.tier===1?2:4;let c=S.revealed[p.id];if(c&&c.phase==='Build'&&c.privilege==='Discount')raw--;return Math.max(0,raw)}
function canPayGold(p,c){return p.gold+E.reduce((s,e)=>s+p.res[e],0)>=c}
async function payGoldCost(p,c,label){if(c<=0)return{gold:0,elements:{}};if(!canPayGold(p,c))return null;if(p.id!=='human'){let g=Math.min(p.gold,c),left=c-g,used={};p.gold-=g;let order=[...B,...A];for(const e of order){let n=Math.min(p.res[e],left);p.res[e]-=n;if(n)used[e]=n;left-=n;if(!left)break}return{gold:g,elements:used}}return await paymentModal(p,c,label)}
async function doBuild(p,t,pos,fromMarket){spellActionLock++;try{let cost=buildCost(p,t),pay=await payGoldCost(p,cost,'建造 '+t.name);if(!pay)return false;p.board[key(pos.q,pos.r)]=clone(t);p.round.builtThisPhase++;let suppress=false;if(t.type==='Element'&&!p.round.firstElementBuilt){p.round.firstElementBuilt=true;if(p.elementTech.includes('E03'))suppress=await tryE03(p,t)}if(t.type==='Element'&&!suppress)p.res[t.element]++;if(p.generic.includes('G01')&&p.round.builtThisPhase===2)p.gold+=2;if(t.type==='Production'&&!p.round.firstProdBuilt){p.round.firstProdBuilt=true;if(p.elementTech.includes('E02'))await tryE02(p,t,pos)}log('build',p.name+' 建造 '+t.name,{coord:pos,cost,payment:pay,suppressReward:suppress});render();return true}finally{spellActionLock--}}
async function tryE03(p,first){let legal=[];S.tileMarkets.T1.forEach((t,i)=>{if(t&&legalPlacements(p,t).length)legal.push({t,i})});if(!legal.length)return false;let use=p.id==='human'?await yesNo('E03 地基工程','放棄第一張 Element 的 placement reward，並免費建造一張公開 T1？'):true;if(!use)return false;let pick=p.id==='human'?await chooseCards('E03 選擇免費 T1',legal.map(x=>tileHtml(x.t)),legal.map((_,i)=>i),true):0;let x=legal[pick],poses=legalPlacements(p,x.t),pos=p.id==='human'?await choosePlacement(p,x.t,poses):aiPlacement(p,x.t,poses);if(!pos)return false;S.tileMarkets.T1[x.i]=S.tileDecks.T1.shift()||null;p.board[key(pos.q,pos.r)]=clone(x.t);p.round.builtThisPhase++;if(p.generic.includes('G01')&&p.round.builtThisPhase===2)p.gold+=2;log('E03',p.name+' E03 免費建造 '+x.t.name,{coord:pos});return true}
async function tryE02(p,t,pos){let out=calcBaseOutputAt(p,pos);let n=out[t.element]||0;if(n<1)return;let use=p.id==='human'?await yesNo('E02 工房擴建','支付 2G（可元素代金）取得 1 '+ICON[t.element]+'？'):canPayGold(p,2);if(use){let pay=await payGoldCost(p,2,'E02');if(pay){p.res[t.element]++;log('E02',p.name+' E02 取得 '+t.element,{payment:pay})}}}
async function e07Entry(p){let els=Object.entries(p.board).filter(([k,t])=>t.type==='Element'&&!p.markers.generators.includes(k));if(!els.length||!canPayGold(p,1))return;let use=p.id==='human'?await yesNo('E07 自動化生產線','支付 1G 放置一個生產器 marker？'):true;if(!use)return;let idx=p.id==='human'?await chooseCards('選擇 Element tile',els.map(([k,t])=>`${tileHtml(t)}<div>${k}</div>`),els.map((_,i)=>i),true):0;let pay=await payGoldCost(p,1,'E07');if(pay){p.markers.generators.push(els[idx][0]);log('E07',p.name+' 放置 generator',{coord:els[idx][0],payment:pay})}}
function legalPlacements(p,t){let empty=CELLS.filter(c=>!p.board[key(c.q,c.r)]);if(t.type==='Production')return empty;let count=Object.values(p.board).filter(x=>x.type==='Element'&&x.element===t.element).length;if(!count)return empty;return empty.filter(c=>DIR.some(([dq,dr])=>{let n=p.board[key(c.q+dq,c.r+dr)];return n&&n.type==='Element'&&n.element===t.element}))}
async function resolveStudy(order){for(const pid of order){let p=player(pid),c=S.revealed[pid];if(c.phase==='Study'&&c.privilege==='Upgrade'){let up=p.spells.filter(x=>x.level<3);if(!up.length)continue;let idx=p.id==='human'?await chooseCards('Upgrade：選一張術式 +1 Lv',up.map(spellOwnedHtml),up.map((_,i)=>i),true):0;up[idx].level++;log('upgrade',p.name+' 升級 '+spellDef(up[idx].uid).name,{uid:up[idx].uid,level:up[idx].level});continue}let search=c.phase==='Study'&&c.privilege==='Search';let tier=p.id==='human'?['T1','T2'][await chooseSimple('Study 指定 Tier',['T1','T2'])]:aiStudyTier(p);let n=(search?4:2)+(p.generic.includes('G03')?1:0),draw=S.spellDecks[tier].splice(0,Math.min(n,S.spellDecks[tier].length));if(!draw.length)continue;let idx=-1;if(p.id==='human'){let opts=draw.map(spellCardHtml).concat(['Pass / keep 0']);let cidx=await chooseCards((search?'Search':'Study')+'：最多留 1 張',opts,opts.map((_,i)=>i),true);idx=cidx===draw.length?-1:cidx}else idx=aiSpellChoice(p,draw);if(idx>=0){let need=p.spells.length>=p.capacity;if(need){let cost=3*(p.slotPurchases+1),buy=p.id==='human'?await yesNo('術式容量已滿','支付 '+cost+'G 購買下一個術式槽？'):canPayGold(p,cost);if(buy){let pay=await payGoldCost(p,cost,'購買術式槽');if(pay){p.slotPurchases++;p.capacity++;log('slot',p.name+' 購買術式槽',{cost,payment:pay})}else idx=-1}else idx=-1}}if(idx>=0){let s=draw[idx];p.spells.push({uid:s._uid,level:1});log('study',p.name+' 取得 '+s.name,{tier,drawn:draw.map(x=>x._uid),kept:s._uid});draw.forEach((x,i)=>{if(i!==idx)S.spellDecks[tier].push(x)})}else{draw.forEach(x=>S.spellDecks[tier].push(x));log('study',p.name+' keep 0',{tier,drawn:draw.map(x=>x._uid)})}}}
function aiStudyTier(p){let hasA=Object.fromEntries(A.map(e=>[e,p.res[e]]));return Object.values(hasA).some(x=>x>0)||Object.values(p.board).some(t=>t.type==='Production'&&t.element!=='Extraction')?'T2':'T1'}
async function resolveTech(order){
 for(let oi=0;oi<order.length;oi++){
  let pid=order[oi],p=player(pid),selector=S.revealed[pid].phase==='Tech';
  let ownedBefore=[...p.generic,...p.elementTech,...p.breakTech],marketBefore=clone(S.elementTechMarket),resolution={playerId:pid,isTechSelector:selector,publicOrderIndex:oi,genericOpportunity:{candidates:[],selectedTechId:null,passed:true,goldCost:0,paymentBreakdown:null},specializedOpportunity:{elementCandidates:[],eligibleBreakthroughCandidates:[],selectedTechId:null,selectedType:null,passed:true,goldCost:0,paymentBreakdown:null},techsOwnedBefore:ownedBefore,elementMarketBefore:marketBefore};

  // Slot 1: everyone gets exactly one Generic Research Opportunity.
  let genericCandidates=S.genericTech.filter(t=>!p.generic.includes(t.id));
  resolution.genericOpportunity.candidates=genericCandidates.map(t=>t.id);
  let g=await chooseTechForSlot(p,'generic',genericCandidates);
  if(g){let result=await acquireTech(p,g);if(result){resolution.genericOpportunity.selectedTechId=g.id;resolution.genericOpportunity.passed=false;resolution.genericOpportunity.goldCost=g.cost_gold;resolution.genericOpportunity.paymentBreakdown=result.payment}}

  // Slot 2: Tech selectors only; legality is recomputed after Generic acquisition.
  if(selector){
   let elementCandidates=S.elementTechMarket.filter(Boolean);
   let breakthroughCandidates=S.breakTech.filter(t=>!p.breakTech.includes(t.id)&&breakEligible(p,t.id));
   resolution.specializedOpportunity.elementCandidates=elementCandidates.map(t=>t.id);
   resolution.specializedOpportunity.eligibleBreakthroughCandidates=breakthroughCandidates.map(t=>t.id);
   let specializedCandidates=[...elementCandidates,...breakthroughCandidates];
   let sp=await chooseTechForSlot(p,'specialized',specializedCandidates);
   if(sp){let result=await acquireTech(p,sp);if(result){resolution.specializedOpportunity.selectedTechId=sp.id;resolution.specializedOpportunity.selectedType=sp.category.includes('Ordinary')?'element':'breakthrough';resolution.specializedOpportunity.passed=false;resolution.specializedOpportunity.goldCost=sp.cost_gold;resolution.specializedOpportunity.paymentBreakdown=result.payment}}
  }
  resolution.techsOwnedAfter=[...p.generic,...p.elementTech,...p.breakTech];
  resolution.elementMarketAfter=clone(S.elementTechMarket);
  log('tech_resolution',p.name+' Tech resolution 完成',resolution);
 }
 // Existing canonical phase-end market refresh: slot 1→2→3 to bottom, then refill.
 if(S.selected.includes('Tech')){for(let i=0;i<S.elementTechMarket.length;i++)if(S.elementTechMarket[i])S.elementTechDeck.push(S.elementTechMarket[i]);S.elementTechMarket=[];while(S.elementTechMarket.length<3&&S.elementTechDeck.length)S.elementTechMarket.push(S.elementTechDeck.shift());log('tech_market_refresh','Element Tech market phase-end refresh',{market:S.elementTechMarket.map(t=>t&&t.id)})}
}
async function chooseTechForSlot(p,slot,candidates){
 if(!candidates.length)return null;
 if(p.id==='human'){
  let title=slot==='generic'?'Tech：Generic 研究機會（至多 1 個）':'Tech：Element / Breakthrough 專門研究機會（至多 1 個）';
  let opts=candidates.map(techHtml).concat(['Pass']);
  let c=await chooseCards(title,opts,opts.map((_,i)=>i),true);
  return c===candidates.length?null:candidates[c];
 }
 return aiTechSlotChoice(p,slot,candidates);
}
function aiTechSlotChoice(p,slot,candidates){
 let scored=candidates.map((t,i)=>{let score=0;if(!canPayGold(p,t.cost_gold))score-=100;score+=t.category.includes('Breakthrough')?5:2;score-=t.cost_gold*.35;if(S.round>=9)score+=t.id==='A02'||t.id==='F02'||t.id==='A04'?2:0;if(p.gold<t.cost_gold+2)score-=2;return[i,score]}).sort((a,b)=>b[1]-a[1]||a[0]-b[0]);
 if(!scored.length||scored[0][1]<=0)return null;
 return candidates[scored[0][0]];
}
async function acquireTech(p,t){let pay=await payGoldCost(p,t.cost_gold,'研究 '+t.name);if(!pay)return null;if(t.category==='Generic')p.generic.push(t.id);else if(t.category.includes('Ordinary')){p.elementTech.push(t.id);let i=S.elementTechMarket.findIndex(x=>x&&x.id===t.id);if(i>=0)S.elementTechMarket[i]=S.elementTechDeck.shift()||null}else p.breakTech.push(t.id);if(t.id==='E01')await placeGather(p);if(t.id==='E06')await placeE06(p);if(t.id==='A04'&&new Set(p.round.coverage).size===4)p.vp+=3;log('tech',p.name+' 研究 '+t.id+' '+t.name,{slot:t.category==='Generic'?'generic':(t.category.includes('Ordinary')?'specialized-element':'specialized-breakthrough'),payment:pay});render();return{payment:pay,techId:t.id}}
async function placeGather(p){let els=Object.entries(p.board).filter(([k,t])=>t.type==='Element');if(!els.length)return;let idx=p.id==='human'?await chooseCards('E01：選擇採集站位置',els.map(([k,t])=>tileHtml(t)+'<div>'+k+'</div>'),els.map((_,i)=>i),true):0;p.markers.gather=els[idx][0]}
async function placeE06(p){let ring=CELLS.filter(c=>Math.max(Math.abs(c.q),Math.abs(c.r),Math.abs(-c.q-c.r))===3&&!p.board[key(c.q,c.r)]);if(!ring.length)return;let pos=p.id==='human'?await choosePlacement(p,{type:'Production',element:'Extraction',name:'第二元素汲取井'},ring):ring[0];p.board[key(pos.q,pos.r)]={uid:'E06-'+p.id,type:'Production',element:'Extraction',name:'第二元素汲取井'}}
function breakEligible(p,id){let vals=Object.values(p.board),cnt=e=>vals.filter(t=>t.type==='Element'&&t.element===e).length,prod=calcProd(p).totals;if(id==='W05')return cnt('Water')>=7;if(id==='W06')return vals.filter(t=>t.type==='Production'&&(t.element==='Steam'||t.element==='Frost')).filter(t=>maxTileOutputFor(p,t)>=3).length>=2;if(id==='W07')return prod.Water>=3&&prod.Earth===0;if(id==='F05'){return Object.entries(p.board).some(([k,t])=>{if(t.type!=='Element'||t.element!=='Fire')return false;let [q,r]=k.split(',').map(Number);return DIR.every(([dq,dr])=>{let x=p.board[key(q+dq,r+dr)];return x&&x.type==='Element'&&x.element==='Fire'})})}if(id==='F06')return p.spells.filter(s=>s.level===3).length>=3&&p.spells.filter(s=>s.level===3&&recipeHas(spellDef(s.uid).levels[2].recipe,'Fire')).length>=2;if(id==='F07')return Object.values(p.board).filter(t=>t.type==='Production'&&(t.element==='Steam'||t.element==='Magma')).filter(t=>maxTileOutputFor(p,t)>=2).length>=2;if(id==='E05'){let pr=vals.filter(t=>t.type==='Production');return pr.length>=5&&pr.filter(t=>maxTileOutputFor(p,t)>=3).length>=3}if(id==='E06')return vals.length>=15&&CELLS.some(c=>Math.max(Math.abs(c.q),Math.abs(c.r),Math.abs(-c.q-c.r))===3&&!p.board[key(c.q,c.r)]);if(id==='E07')return cnt('Earth')>=8||B.every(e=>cnt(e)>=3);if(id==='A05')return p.spells.filter(s=>spellDef(s.uid).tier===1).length>=5;if(id==='A06')return cnt('Wind')>=7;if(id==='A07')return p.spells.length>=8;return false}
function maxTileOutputFor(p,t){let ent=Object.entries(p.board).find(([k,x])=>x.uid===t.uid);if(!ent)return 0;let out=calcBaseOutputAt(p,{q:+ent[0].split(',')[0],r:+ent[0].split(',')[1]});return Object.values(out).reduce((a,b)=>a+b,0)}
async function resolveProduction(order){for(const pid of order)await completeProduction(player(pid),'free');for(const pid of order){let p=player(pid),c=S.revealed[pid],cost=(c.phase==='Production'&&c.privilege==='Proliferation')?0:4;if(cost>0&&p.generic.includes('G04')&&!p.round.g04used)cost=Math.max(0,cost-2);let buy=p.id==='human'?await yesNo('第一次增殖','執行一次完整 Production？成本 '+cost+'G'):aiProlif(p,cost);if(buy){let pay=await payGoldCost(p,cost,'第一次增殖');if(pay){if(cost>0&&p.generic.includes('G04'))p.round.g04used=true;p.round.prolif=1;await completeProduction(p,'prolif1')}}}for(const pid of order){let p=player(pid);if(p.round.prolif<1)continue;let cost=7;if(p.generic.includes('G04')&&!p.round.g04used)cost=5;let buy=p.id==='human'?await yesNo('第二次增殖','再執行一次完整 Production？成本 '+cost+'G'):aiProlif(p,cost);if(buy){let pay=await payGoldCost(p,cost,'第二次增殖');if(pay){if(p.generic.includes('G04')&&!p.round.g04used)p.round.g04used=true;p.round.prolif=2;await completeProduction(p,'prolif2')}}}}
async function completeProduction(p,source){spellActionLock++;try{let calc=calcProd(p),before=clone(p.res);for(const e of E)p.res[e]+=calc.totals[e]||0;if(p.markers.gather){let t=p.board[p.markers.gather];if(t)p.res[t.element]++}for(const k of p.markers.generators){let t=p.board[k];if(t)p.res[t.element]++}if(p.elementTech.includes('W01')){let use=p.id==='human'?await yesNo('W01 水脈增壓','支付 1G 額外產 1 Water？'):canPayGold(p,1);if(use){let pay=await payGoldCost(p,1,'W01');if(pay)p.res.Water++}}if(p.breakTech.includes('E05')){let prods=Object.entries(p.board).filter(([k,t])=>t.type==='Production');if(prods.length){let idx=p.id==='human'?await chooseCards('E05：額外執行一座 Production',prods.map(([k,t])=>t.name+'<div>'+k+'</div>'),prods.map((_,i)=>i),true):0;let [k,t]=prods[idx],[q,r]=k.split(',').map(Number),out=calcBaseOutputAt(p,{q,r});for(const e of E)p.res[e]+=out[e]||0}}log('production',p.name+' 完整 Production '+source,{perTile:calc.perTile,total:calc.totals,before,after:clone(p.res)})}finally{spellActionLock--}}
function calcProd(p){let totals=emptyRes(),perTile=[];for(const [k,t] of Object.entries(p.board)){if(t.type!=='Production')continue;let [q,r]=k.split(',').map(Number),out=calcBaseOutputAt(p,{q,r});perTile.push({coord:k,tile:t.name,out});for(const e of E)totals[e]+=out[e]||0}return{perTile,totals,value:Object.values(totals).reduce((a,b)=>a+b,0)}}
function calcBaseOutputAt(p,pos){let t=p.board[key(pos.q,pos.r)]||pendingPlacement?.tile;if(!t||t.type!=='Production')return emptyRes();let adj={Water:0,Fire:0,Earth:0,Wind:0};for(const [dq,dr] of DIR){let n=p.board[key(pos.q+dq,pos.r+dr)];if(n&&n.type==='Element')adj[n.element]++}let out=emptyRes();if(t.element==='Extraction')for(const e of B)out[e]=adj[e];else{let parents=CONTENT.elements.parents[t.element];if(parents)out[t.element]=Math.min(adj[parents[0]],adj[parents[1]])}return out}
async function roundEndSpellWindow(){let order=publicOrder();S.status='round_end_spell';render();log('round_end_spell','Round End Spell Window',{order});for(const pid of order)await spellWindow(player(pid),true);if(S.round===12){S.status='game_over';let max=Math.max(...S.players.map(p=>p.vp)),ties=S.players.filter(p=>p.vp===max).sort((a,b)=>b.start-a.start),win=ties[0];log('game_over','遊戲結束，勝者 '+win.name,{winner:win.id});render();return}for(const p of S.players)p.round=resetRoundState();S.round++;S.status='phase_selection';S.currentPhase=null;S.revealed={};S.selected=[];render();return phaseSelection()}
async function spellWindow(p,isRoundEnd=false){let safety=0,shown=false;while(safety++<30){let acts=legalSpellActions(p);if(p.id==='human'){let opts=acts.map(a=>`${spellOwnedHtml(a.owned)}<div>使用 Lv${a.level}</div>`);opts.push(acts.length?'結束本次 Spell Window':'目前沒有可施放術式 — 結束 Spell Window');let title=(isRoundEnd?'回合結束施法時機：':'')+p.name+' Spell Window';let c=await chooseCards(title,opts,opts.map((_,i)=>i),true,false);shown=true;if(c===acts.length)break;await activateSpell(p,acts[c].owned,acts[c].level,'normal')}else{if(!acts.length)break;let best=acts.sort((a,b)=>spellActionValue(b)-spellActionValue(a))[0];if(spellActionValue(best)<=0)break;await activateSpell(p,best.owned,best.level,'normal');if(rng()<.25)break}if(p.breakTech.includes('F05')&&p.res.Fire>=2){let use=p.id==='human'?await yesNo('F05 無限過載','支付 2 Fire → 3VP？'):p.res.Fire>=4;if(use){p.res.Fire-=2;p.vp+=3;log('F05',p.name+' 使用無限過載')}}}if(isRoundEnd&&p.id==='human'&&!shown){await chooseCards('回合結束施法時機：'+p.name,['目前沒有可施放術式 — 結束 Spell Window'],[0],true,false)}}
function legalSpellActions(p){let arr=[];for(const owned of p.spells){if(p.round.normalUsed.includes(owned.uid))continue;for(let lvl=1;lvl<=owned.level;lvl++){let d=spellDef(owned.uid),req=parseRecipe(d.levels[lvl-1].recipe);if(canPayRecipe(p,req))arr.push({owned,level:lvl})}}return arr}
function extractRecipeElements(text){let hits=[];for(const [el,icon] of Object.entries(ICON)){let from=0;while(true){let i=text.indexOf(icon,from);if(i<0)break;hits.push({i,el});from=i+icon.length}}return hits.sort((a,b)=>a.i-b.i).map(x=>x.el)}
function parseRecipe(str){let segs=[],cur='',depth=0;for(const ch of str){if(ch==='(')depth++;if(ch===')')depth--;if(ch==='+'&&depth===0){segs.push(cur);cur=''}else cur+=ch}if(cur)segs.push(cur);return segs.map(seg=>{let m=seg.match(/×(\d+)/),count=m?+m[1]:1,clean=seg.replace(/×\d+/g,''),els=extractRecipeElements(clean);if(clean.startsWith('('))return{choice:els,count};if(!els.length)throw new Error('無法解析術式配方：'+seg);return{el:els[0],count}})}
function emojiToEl(x){return Object.keys(ICON).find(k=>ICON[k]===x)} function recipeHas(str,el){return str.includes(ICON[el])}
function canPayRecipe(p,req){let inv=clone(p.res);for(const r of req){if(r.choice){let found=r.choice.find(e=>inv[e]>=r.count);if(!found)return false;inv[found]-=r.count}else if(inv[r.el]>=r.count)inv[r.el]-=r.count;else return false}return true}
function recipeShortfall(p,req){let inv=clone(p.res),miss={};for(const r of req){if(r.choice){let opts=r.choice.map(e=>({e,have:inv[e]||0,def:Math.max(0,r.count-(inv[e]||0))})).sort((a,b)=>a.def-b.def||b.have-a.have);let x=opts[0];let paid=Math.min(inv[x.e]||0,r.count);inv[x.e]=(inv[x.e]||0)-paid;if(paid<r.count)miss[x.e]=(miss[x.e]||0)+(r.count-paid)}else{let have=inv[r.el]||0,paid=Math.min(have,r.count);inv[r.el]=have-paid;if(paid<r.count)miss[r.el]=(miss[r.el]||0)+(r.count-paid)}}return miss}
function spellLegalityStatus(p,o){if(p.round.normalUsed.includes(o.uid))return{kind:'used',text:'本輪 normal activation 已使用'};let d=spellDef(o.uid),ok=[],best=null;for(let lvl=1;lvl<=o.level;lvl++){let req=parseRecipe(d.levels[lvl-1].recipe);if(canPayRecipe(p,req))ok.push(lvl);else{let miss=recipeShortfall(p,req),n=Object.values(miss).reduce((a,b)=>a+b,0);if(!best||n<best.n)best={lvl,miss,n}}}if(ok.length)return{kind:'castable',text:'可施放：'+ok.map(x=>'Lv'+x).join(' / ')};let parts=Object.entries(best?.miss||{}).map(([e,n])=>`${ICON[e]||e}×${n}`);return{kind:'blocked',text:'不可施放'+(best?`：Lv${best.lvl} 缺 ${parts.join('、')||'未知需求'}`:'')}}

async function activateSpell(p,owned,lvl,source){let d=spellDef(owned.uid),def=d.levels[lvl-1],req=parseRecipe(def.recipe),paid={};for(const r of req){let el=r.el;if(r.choice){if(p.id==='human'){let possible=r.choice.filter(e=>p.res[e]>=r.count);el=possible[await chooseSimple('配方二選一',possible.map(x=>ICON[x]+' '+x))]}else el=r.choice.sort((a,b)=>p.res[b]-p.res[a])[0]}p.res[el]-=r.count;paid[el]=(paid[el]||0)+r.count}let reward=parseReward(def.reward);if(p.elementTech.includes('F01')&&!p.round.techUsed.F01&&p.res.Fire>=1){let use=p.id==='human'?await yesNo('F01 過載施法','額外支付 1 Fire → +2VP？'):true;if(use){p.res.Fire--;p.vp+=2;p.round.techUsed.F01=true}}if(p.elementTech.includes('F04')&&!p.round.techUsed.F04&&recipeHas(def.recipe,'Fire')&&p.res.Fire>=1&&canPayGold(p,2)){let use=p.id==='human'?await yesNo('F04 熔爐充能','支付 2G + 1 Fire 充能？'):true;if(use){let pay=await payGoldCost(p,2,'F04');if(pay){p.res.Fire--;p.f04=Math.min(3,p.f04+1);p.vp+=p.f04;p.round.techUsed.F04=true}}}p.gold+=reward.gold;p.vp+=reward.vp;p.round.normalUsed.push(owned.uid);p.round.activationCount++;if(!p.round.distinct.includes(owned.uid))p.round.distinct.push(owned.uid);for(const e of B)if(recipeHas(def.recipe,e)&&!p.round.coverage.includes(e))p.round.coverage.push(e);applySpellTechTriggers(p,def,paid);log('spell_activation',p.name+' '+d.name+' Lv'+lvl,{uid:owned.uid,printedRecipe:def.recipe,paid,reward});render()}
function applySpellTechTriggers(p,def,paid){if(p.elementTech.includes('W03')&&!p.round.techUsed.W03&&Object.values(paid).reduce((a,b)=>a+b,0)>=3&&(paid.Water||0)>0){p.res.Water++;p.round.techUsed.W03=true}if(p.elementTech.includes('W04')&&!p.round.techUsed.W04&&((paid.Steam||0)+(paid.Frost||0)>0)){p.res.Water++;p.round.techUsed.W04=true}if(p.elementTech.includes('F02')&&!p.round.techUsed.F02&&parseRecipe(def.recipe).reduce((a,r)=>a+r.count,0)>=4){p.vp+=2;p.round.techUsed.F02=true}if(p.generic.includes('A02')&&p.round.activationCount===4)p.vp+=2;if(p.elementTech.includes('A04')&&!p.round.techUsed.A04&&new Set(p.round.coverage).size===4){p.vp+=3;p.round.techUsed.A04=true}if(p.breakTech.includes('A06')){if(p.round.activationCount===3)p.vp+=1;if(p.round.activationCount===5)p.vp+=2;if(p.round.activationCount===7)p.vp+=3}if(p.breakTech.includes('A07')){let n=p.round.distinct.length;if(n===4)p.vp+=2;if(n===6)p.vp+=3;if(n===8)p.vp+=5}if(p.breakTech.includes('W07')&&(paid.Water||0)>=2)p.res.Water++}
function parseReward(s){let g=(s.match(/(\d+)G/)||[0,0])[1],v=(s.match(/(\d+)VP/)||[0,0])[1];return{gold:+g,vp:+v}}
function spellActionValue(a){let d=spellDef(a.owned.uid),r=parseReward(d.levels[a.level-1].reward);return r.vp*2+r.gold*.6+a.level*.1}
function aiTileChoice(p,draw){let best=draw.map((t,i)=>[i,aiTileScore(p,t)]).sort((a,b)=>b[1]-a[1]);return best[0][0]}function aiTileScore(p,t){if(t.type==='Element'){let demand=0;for(const s of p.spells){let d=spellDef(s.uid);for(let i=0;i<s.level;i++)if(recipeHas(d.levels[i].recipe,t.element))demand+=1}return 3+demand}let legal=legalPlacements(p,t),best=0;for(const pos of legal){let old=p.board[key(pos.q,pos.r)];p.board[key(pos.q,pos.r)]=t;let out=calcBaseOutputAt(p,pos)[t.element]||0;delete p.board[key(pos.q,pos.r)];if(old)p.board[key(pos.q,pos.r)]=old;best=Math.max(best,out)}return 2+best*3}

function recipeText(s){return s.levels.map(x=>`Lv${x.level} ${x.recipe} → ${x.reward}`).join('<br>')}function spellCardHtml(s){return `<div class=name>${s.name}</div><div class=small>${s.id} · ${s.archetype}</div><div>${recipeText(s)}</div>`}function spellOwnedHtml(o){let s=spellDef(o.uid);return `<div class=name>${s.name} Lv${o.level}</div><div class=small>${s.id}</div>${s.levels.slice(0,o.level).map(x=>`Lv${x.level} ${x.recipe} → ${x.reward}`).join('<br>')}`}function tileHtml(t){return `<div class=name>${t.name}</div><div class=small>${t.type} · T${t.tier||'-'}</div>`}function techHtml(t){return `<div class=name>${t.id} ${t.name} · ${t.cost_gold}G</div><div class=small>${t.category}</div><div>${t.text}</div>`}

function paymentModal(p,cost,label){return new Promise(resolve=>{let state={Gold:Math.min(p.gold,cost)};for(const e of E)state[e]=0;function redraw(){let used=state.Gold+E.reduce((s,e)=>s+state[e],0),remain=cost-used;modal(`<h2>${label}</h2><p>Final Gold Cost: <b>${cost}G</b>｜尚差 ${remain}</p><div class=payline><span>Gold</span><span>${state.Gold}/${p.gold}</span><span><button data-k=Gold data-d=-1>-</button><button data-k=Gold data-d=1>+</button></span></div>${E.map(e=>`<div class=payline><span>${ICON[e]} ${e}</span><span>${state[e]}/${p.res[e]}</span><span><button data-k=${e} data-d=-1>-</button><button data-k=${e} data-d=1>+</button></span></div>`).join('')}<div class=row><button class=primary id=pay ${remain===0?'':'disabled'}>確認付款</button><button id=cancel>取消</button></div>`);document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k,d=+b.dataset.d,max=k==='Gold'?p.gold:p.res[k];state[k]=Math.max(0,Math.min(max,state[k]+d));if(state.Gold+E.reduce((s,e)=>s+state[e],0)>cost)state[k]-=d;redraw()});document.querySelector('#cancel').onclick=()=>{closeModal();resolve(null)};let pay=document.querySelector('#pay');if(pay)pay.onclick=()=>{p.gold-=state.Gold;let used={};for(const e of E){p.res[e]-=state[e];if(state[e])used[e]=state[e]}closeModal();resolve({gold:state.Gold,elements:used})}}redraw()})}
function exportJSON(){if(!S){alert('目前沒有可匯出的遊戲狀態。');return}let text=JSON.stringify({...S,playtestSummary:summary()},null,2),name=`element-pipeline-v09-${S.seed}.json`;let root=document.querySelector('#exportRoot');root.innerHTML=`<div class="export-panel"><div class=row><div class=title>測試紀錄 JSON</div><div class=grow></div><button id=closeExport>關閉</button></div><div class="export-note">若 Safari / 本機 HTML 阻擋下載，可直接「複製 JSON」或從下方文字框全選複製。</div><div class=row><button class=primary id=downloadExport>下載 JSON</button><button id=copyExport>複製 JSON</button><span id=exportStatus class=small></span></div><textarea id=exportText spellcheck=false></textarea></div>`;let ta=document.querySelector('#exportText');ta.value=text;document.querySelector('#closeExport').onclick=()=>root.innerHTML='';document.querySelector('#downloadExport').onclick=()=>{try{let blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);document.querySelector('#exportStatus').textContent='已送出下載；若沒有出現檔案，請使用複製 JSON。'}catch(err){document.querySelector('#exportStatus').textContent='下載失敗：'+err.message}};document.querySelector('#copyExport').onclick=async()=>{let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(!ok){ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e){}}document.querySelector('#exportStatus').textContent=ok?'已複製到剪貼簿':'無法自動複製，請在文字框中全選後手動複製。'}}
function summary(){return{final:S.players.map(p=>({id:p.id,vp:p.vp,gold:p.gold,res:p.res,tech:[...p.generic,...p.elementTech,...p.breakTech],spells:p.spells.length,tiles:Object.keys(p.board).length})),eventCount:S.events.length,errorCount:S.errors.length}}
function fatal(err){console.error(err);document.querySelector('#fatal').innerHTML=`<div class=error><b>發生錯誤</b><pre>${String(err.stack||err)}</pre></div>`;if(S)S.errors.push(String(err.stack||err))}
window.addEventListener('error',e=>fatal(e.error||e.message));window.addEventListener('unhandledrejection',e=>fatal(e.reason));
document.querySelector('#startBtn').onclick=()=>setupGame(document.querySelector('#seedInput').value||'alpha-v09');document.querySelector('#newBtn').onclick=()=>{if(confirm('確定開始新遊戲？'))setupGame(document.querySelector('#seedInput').value||'alpha-v09')};document.querySelector('#exportBtn').onclick=exportJSON;document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');viewBoard=b.dataset.tab;renderBoard()});
</script></body></html>
