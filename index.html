<style>
:root{--bg:#0e1117;--panel:#171b24;--panel2:#202634;--line:#323b50;--text:#edf2f7;--muted:#9aa7bd;--good:#7dd3a7;--warn:#f6c76f;--bad:#ff8d8d;--w:#5cb8ff;--f:#ff7b62;--e:#8cc56d;--n:#c49cff;--a:#f0d77a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px}
button,select,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:#111722;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.title{font-weight:800;font-size:18px}.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 9px}.clock{font-weight:700;color:var(--warn)}
.app{display:grid;grid-template-columns:minmax(680px,1.45fr) minmax(380px,.85fr) 380px;gap:10px;padding:10px;align-items:start}.col{display:flex;flex-direction:column;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.card h2,.card h3{margin:0 0 8px}.sub{color:var(--muted);font-size:12px}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{background:#131822;border:1px solid var(--line);border-radius:10px;padding:8px}.player.active{outline:2px solid var(--warn)}.res{display:flex;gap:6px;flex-wrap:wrap}.r{padding:2px 6px;border:1px solid #3b465e;border-radius:6px;background:#1b2230}.w{color:var(--w)}.f{color:var(--f)}.e{color:var(--e)}.n{color:var(--n)}.a{color:var(--a)}
.wheel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.sector{border:1px solid #3a4255;border-radius:8px;padding:6px;background:#191f2b;min-height:145px}.sector.prod{outline:2px solid var(--good)}.sector.unselected{outline:2px dashed var(--a)}.sector h4{margin:0 0 4px;display:flex;justify-content:space-between}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.slot{border:1px solid #46516a;border-radius:6px;min-height:34px;padding:3px;font-size:11px;text-align:center;background:#10151f}.slot.mid{grid-column:span 2;background:#1c2330}.slot.inner{grid-column:1/-1;background:#23202e}.charge{display:inline-block;margin-left:2px;background:#ffd166;color:#111;border-radius:50%;width:16px;height:16px;line-height:16px;font-weight:800}.pointer{font-weight:800;color:#9fe0ff}
.market{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.mcard{border:1px solid #414b63;border-radius:8px;padding:7px;background:#191f2a}.mcard.legal{border-color:var(--good);cursor:pointer}.mcard.used{opacity:.45}.mcard strong{display:block}.req{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.reward{color:#f4d88a}.dealer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dealer{border:1px solid #414b63;border-radius:8px;padding:7px;background:#1a1f29;min-height:110px}.dealer.legal{border-color:var(--good);cursor:pointer}
#decision{position:sticky;top:62px;max-height:calc(100vh - 74px);overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid #46516a;border-radius:7px;background:#252e40;color:var(--text);padding:6px 9px;cursor:pointer}.btn:hover{background:#303a50}.btn.primary{border-color:#72b7ff}.btn.good{border-color:var(--good)}.btn.warn{border-color:var(--warn)}.btn.bad{border-color:var(--bad)}.btn:disabled{opacity:.4;cursor:not-allowed}.choice{border:1px solid #3a455d;border-radius:8px;padding:7px;margin:6px 0;background:#111722}.choice:hover{border-color:#6f87ae}.choice.legal{cursor:pointer}.tiny{font-size:11px;color:var(--muted)}
.log{height:310px;overflow:auto;background:#0c1017;border:1px solid #293143;border-radius:7px;padding:6px;font-family:ui-monospace,monospace;font-size:11px}.logline{padding:2px 0;border-bottom:1px solid #171d28}.debug{display:flex;gap:5px;flex-wrap:wrap}.overlay{position:fixed;inset:0;background:#000a;z-index:99;display:none;align-items:center;justify-content:center}.overlay.show{display:flex}.modal{width:min(900px,94vw);max-height:90vh;overflow:auto;background:#171b24;border:1px solid #56627f;border-radius:12px;padding:14px}.summary{font-size:18px}.techgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tech{border:1px solid #3a455d;border-radius:6px;padding:5px;text-align:center}.tech .lv{font-size:18px;font-weight:800}.gameover{color:#ffd166;font-weight:900}.testdefault{color:#ffca7a}.hidden{display:none!important}@media(max-width:1300px){.app{grid-template-columns:1fr 420px}.right{grid-column:1/-1}#decision{position:static;max-height:none}}@media(max-width:850px){.app{grid-template-columns:1fr}.players{grid-template-columns:1fr}.market{grid-template-columns:1fr}.dealer-grid{grid-template-columns:1fr}}
</style>
</head><body>
<div class="top"><div class="title">元素管道｜Contract Branch v0.15 T1 Playtest</div><span id="phasePill" class="pill">Setup</span><span id="clockPill" class="pill clock">T1 One-Time remaining: —</span><span id="pointerPill" class="pill pointer">Pointer —</span><span id="seedPill" class="pill">Seed —</span><span id="gapPill" class="pill testdefault">TEST DEFAULTS: start 4G / One-Time market 4</span></div>
<div class="app">
  <div class="col">
    <div class="card"><h2>四人工房</h2><div id="players" class="players"></div></div>
    <div class="card"><h2>公共 Contract 區</h2><div class="sub">T1 One-Time 是唯一正式 game clock；最後一張完成且 action 連鎖結算完畢後立即終局。</div><h3 style="margin-top:10px">One-Time</h3><div id="oneTime" class="market"></div><h3 style="margin-top:10px">Long-Term</h3><div id="longTerm" class="market"></div></div>
  </div>
  <div class="col">
    <div class="card"><h2>Dealer Market</h2><div id="dealerMarket" class="dealer-grid"></div></div>
    <div class="card"><h2>Structured Log</h2><div class="actions"><button class="btn" onclick="downloadLog()">Export Log</button><button class="btn" onclick="copyLatestState()">Copy State Summary</button></div><div id="log" class="log"></div></div>

      <button class="btn" onclick="restartSameSeed()">Restart Same Seed</button><button class="btn" onclick="debugResources()">Set Human Resources</button><button class="btn" onclick="debugTech()">Set Human Tech</button><button class="btn" onclick="debugFee()">Set Fee</button><button class="btn" onclick="debugPointer()">Set Pointer</button><button class="btn" onclick="debugCharge()">Inject Charge</button><button class="btn bad" onclick="debugEndGame()">TEST ONLY End Game</button>

<script>
'use strict';
// Contract Branch v0.15 T1 vertical slice. This file is a fresh implementation.
const B=['W','F','E','N']; const A=['Steam','Magma','Sandstorm','Frost'];
const RES=[...B,...A]; const SNAME=['Water','Fire','Earth','Wind']; const BNAME={W:'Water',F:'Fire',E:'Earth',N:'Wind'};
const ICON={W:'💧',F:'🔥',E:'🌱',N:'🌪️',Steam:'💨',Magma:'🌋',Sandstorm:'⏳',Frost:'❄️'};
const CLS={W:'w',F:'f',E:'e',N:'n',Steam:'a',Magma:'a',Sandstorm:'a',Frost:'a'};
const PARENTS={Steam:['W','F'],Magma:['F','E'],Sandstorm:['E','N'],Frost:['N','W']};
const NEIGHBOR_A={'W,F':'Steam','F,W':'Steam','F,E':'Magma','E,F':'Magma','E,N':'Sandstorm','N,E':'Sandstorm','N,W':'Frost','W,N':'Frost'};
const SOURCE_GAPS={startingGold:'TEST DEFAULT 4G: v0.15/test guide do not restate starting Gold.',oneTimeMarketSize:'TEST DEFAULT 4: v0.15 names market but does not state its T1 display size.'};
const CFG={players:4,startingGold:4,oneTimeMarketSize:4,engineFeeCap:10,chargeCap:1,outerCost:2,middleCost:4,innerCost:6,prolifCosts:[4,7]};
let G=null, humanWait=null, effectQueue=[], processing=false;
function deep(x){return JSON.parse(JSON.stringify(x))}
function hashSeed(s){let h=2166136261>>>0;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(){G.rngState=(Math.imul(1664525,G.rngState)+1013904223)>>>0;return G.rngState/4294967296}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uid(p='x'){G.uid=(G.uid||0)+1;return p+'-'+G.uid}
function emptyRes(){return Object.fromEntries(RES.map(x=>[x,0]))}
function resTxt(r){return RES.filter(x=>r[x]).map(x=>`${ICON[x]}${r[x]}`).join(' ')||'—'}
function addRes(p,r,m=1){for(const k of RES)p.resources[k]=(p.resources[k]||0)+(r[k]||0)*m}
function spendRes(p,r){for(const k of RES){if((p.resources[k]||0)<(r[k]||0))return false}for(const k of RES)p.resources[k]-=(r[k]||0);return true}
function log(type,msg,data={}){if(!G)return;G.log.push({id:G.log.length+1,turn:G.turnNumber,phase:G.phase,actor:G.activePlayerId,type,msg,data,ts:Date.now()});if(G.log.length>2000)G.log.shift();renderLog()}
function player(id){return G.players.find(p=>p.id===id)}
function human(){return G.players[0]}
function feeCap(p){return techHas(p,'F',10,'B')?5:CFG.engineFeeCap}
function feeTrigger(p,reason){const cost=p.engineFee;if(p.gold<cost)return false;p.gold-=cost;p.engineFee=Math.min(feeCap(p),p.engineFee+1);log('engine_fee',`${p.name} Engine Fee trigger (${reason})：-${cost}G，Fee→${p.engineFee}`,{reason,cost});return true}
function feeIncreaseNoPay(p,n,reason){p.engineFee=Math.min(feeCap(p),p.engineFee+n);log('engine_fee_direct',`${p.name} Engine Fee +${n} (${reason}) → ${p.engineFee}`,{n,reason})}
function reduceFee(p,n,reason){let before=p.engineFee, lowered=Math.min(n,p.engineFee),overflow=n-lowered;p.engineFee-=lowered;if(overflow)p.gold+=overflow;log('fee_reduce',`${p.name} Fee -${n} (${reason})：${before}→${p.engineFee}${overflow?`，overflow +${overflow}G`:''}`,{before,after:p.engineFee,n,overflow,reason});if(lowered>0&&techHas(p,'N',3,'A')){p.resources.N++;log('tech_trigger',`${p.name} Wind Lv3-A：Fee 實際降低 → +1 Wind`)}return {lowered,overflow}}
function techHas(p,t,lv,ch=null){const key={W:'water',F:'fire',E:'earth',N:'wind'}[t];if((p.tech[key]||0)<lv)return false;if(ch&&p.techChoices[`${t}${lv}`]!==ch)return false;return true}
function trackLv(p,t){return p.tech[{W:'water',F:'fire',E:'earth',N:'wind'}[t]]||0}
function aTechOn(p,a,lv){const [x,y]=PARENTS[a];return trackLv(p,x)>=lv&&trackLv(p,y)>=lv}
function gainTP(p,t,n=1,source=''){for(let i=0;i<n;i++){if(t==='choiceWF')queueTPChoice(p,['W','F'],source);else if(t==='choiceFE')queueTPChoice(p,['F','E'],source);else if(t==='choiceEN')queueTPChoice(p,['E','N'],source);else if(t==='choiceWN')queueTPChoice(p,['W','N'],source);else if(t==='wild')queueTPChoice(p,B,source);else applyTP(p,t,source)}}
function queueTPChoice(p,opts,source){if(p.type==='ai'){const t=opts.slice().sort((a,b)=>trackLv(p,a)-trackLv(p,b))[0];applyTP(p,t,source);return}effectQueue.push({kind:'tpChoice',pid:p.id,opts,source})}
function applyTP(p,t,source){const key={W:'water',F:'fire',E:'earth',N:'wind'}[t];if(p.tech[key]>=10){p.vp++;log('tp_overflow',`${p.name} ${BNAME[t]} TP overflow → +1VP`,{source});return}p.tech[key]++;log('tech_point',`${p.name} ${BNAME[t]} Tech → Lv${p.tech[key]}`,{source});const lv=p.tech[key];if([1,3,6,10].includes(lv)&&!p.techChoices[`${t}${lv}`]){if(p.type==='ai'){p.techChoices[`${t}${lv}`]=chooseAItech(p,t,lv);log('tech_choice',`${p.name} ${BNAME[t]} Lv${lv} 選 ${p.techChoices[`${t}${lv}`]}`)}else effectQueue.push({kind:'techChoice',pid:p.id,t,lv})}}
function chooseAItech(p,t,lv){if(t==='F'&&lv===10)return p.engineFee>=4?'B':'A';if(t==='E'&&lv===3)return 'B';if(t==='N'&&lv===6)return 'B';return rng()<.5?'A':'B'}
function makeSector(i){return {name:SNAME[i],outers:[{id:uid('anchor'),type:'outer',element:B[i],anchor:true,charge:0},null,null,null],middles:[null,null],inner:null}}
function makePlayer(i){return {id:i===0?'human':'ai'+i,name:i===0?'Human':`AI ${i}`,type:i===0?'human':'ai',gold:CFG.startingGold,vp:0,resources:emptyRes(),tech:{water:0,fire:0,earth:0,wind:0},techChoices:{},sectors:[0,1,2,3].map(makeSector),engineFee:0,pointer:{boundary:3,direction:'CW'},currentDealer:{id:'initial'},dealerProgressIndex:0,qualifyingContractsThisPhase:0,comboState:{completedDealerIds:[],comboCount:0},passedOutContractPhase:false,flags:{dealerAbilityUsedTurn:false,waterRedrawUsed:false,earthExtraBuildUsed:false,prolifTaken:0},buildDraw:[],production:{}}}
const ONE_TIME=[
 {id:'OT01',req:['W','W','W'],reward:{vp:4},tp:'W'}, {id:'OT02',req:['F','F','F'],reward:{vp:3,gold:1},tp:'F'}, {id:'OT03',req:['E','E','E'],reward:{vp:4},tp:'E'}, {id:'OT04',req:['N','N','N'],reward:{vp:3,gold:1},tp:'N'},
 {id:'OT05',req:['W','W','F'],reward:{vp:5}}, {id:'OT06',req:['F','F','E'],reward:{vp:3,gold:1},special:'fee5plus'}, {id:'OT07',req:['E','E','N'],reward:{vp:4,gold:1}}, {id:'OT08',req:['N','N','W'],reward:{vp:4},special:'feeMinus1'},
 {id:'OT09',req:['W','W','F','F'],reward:{vp:6}}, {id:'OT10',req:['F','F','E','E'],reward:{vp:5},special:'fee5vp'}, {id:'OT11',req:['Steam','W','F'],reward:{vp:5},tp:'choiceWF'}, {id:'OT12',req:['Magma','F','E'],reward:{vp:3,gold:4},tp:'choiceFE'},
 {id:'OT13',req:['Sandstorm','E','N'],reward:{vp:5},tp:'choiceEN'}, {id:'OT14',req:['Frost','W','N'],reward:{vp:3,gold:4},tp:'choiceWN'}, {id:'OT15',req:['Steam','W','W'],reward:{vp:4,gold:4}}, {id:'OT16',req:['Magma','E','N'],reward:{vp:6}},
 {id:'OT17',req:['Steam','W','W','F'],reward:{vp:8}}, {id:'OT18',req:['Magma','F','F','E'],reward:{vp:6,gold:3}}, {id:'OT19',req:['Frost','W','E','N'],reward:{vp:6},special:'fee0ThenMinus'}, {id:'OT20',req:['Sandstorm','E','W','F'],reward:{vp:6,gold:3}}
];
const LT_TEMPLATES=[
 {id:'LT-diff2',name:'兩種不同 B',pattern:'diff2B',reward:{gold:4}}, {id:'LT-same2',name:'兩個相同 B',pattern:'same2B',reward:{gold:4}}, {id:'LT-diff3',name:'三種不同 B',pattern:'diff3B',reward:{gold:7}}, {id:'LT-same3',name:'三個相同 B',pattern:'same3B',reward:{gold:7}}, {id:'LT-anyA',name:'任意 A',pattern:'anyA',reward:{gold:4}}, {id:'LT-AplusB',name:'任意 A + 任意 B',pattern:'AplusB',reward:{gold:6}}
];
const DEALERS={
 water:{id:'water',name:'水路承包商',ability:{req:['W','F'],reward:{vp:1,gold:2}},contracts:[{id:'water-C1',req:['W','W'],reward:{vp:1},tp:'W'},{id:'water-C2',req:['W','W','N'],reward:{vp:2,gold:1},tp:'W'},{id:'water-C3',req:['W','W','W','F'],reward:{vp:3,gold:2},tp:'W'}],completion:{reward:{gold:4},tp:'W'}},
 fire:{id:'fire',name:'熔爐商會',ability:{req:['F','F'],reward:{vp:2}},contracts:[{id:'fire-C1',req:['F','F'],reward:{vp:1},tp:'F'},{id:'fire-C2',req:['F','F','F'],reward:{vp:2,gold:1},tp:'F'},{id:'fire-C3',req:['F','F','F','E'],reward:{vp:4},tp:'F',special:'fireDealerC3'}],completion:{reward:{gold:2},tp:'F',special:'fireDealerCompletion'}},
 earth:{id:'earth',name:'地脈工程局',ability:{req:['E','E'],reward:{vp:1,gold:2}},contracts:[{id:'earth-C1',req:['E','E'],reward:{vp:1},tp:'E'},{id:'earth-C2',req:['E','E','E'],reward:{vp:2,gold:1},tp:'E'},{id:'earth-C3',req:['E','E','E','N'],reward:{vp:2,gold:2},tp:'E',charge:1}],completion:{reward:{gold:2},charge:1}},
 wind:{id:'wind',name:'疾風物流會',ability:{req:['N','W'],reward:{vp:1,gold:2}},contracts:[{id:'wind-C1',req:['N','N'],reward:{vp:1},tp:'N'},{id:'wind-C2',req:['N','W'],reward:{vp:2},comboPrev:'wind-C1',feeReduce:1},{id:'wind-C3',req:['N','E'],reward:{vp:2},comboPrev:'wind-C2',feeZeroVp:1,feeReduce:1},{id:'wind-C4',req:['N','F','W'],reward:{vp:2},tp:'N',comboPrev:'wind-C3',feeZeroVp:1,feeReduce:2}],completion:{reward:{gold:4},feeReduce:2}},
 steam:{id:'steam',name:'蒸汽工坊聯盟',ability:{req:['Steam'],reward:{vp:1,gold:2}},contracts:[{id:'steam-C1',req:['W','F'],reward:{vp:1},tp:'choiceWF'},{id:'steam-C2',req:['Steam','W'],reward:{vp:2,gold:1},tp:'choiceWF'},{id:'steam-C3',req:['Steam','W','F'],reward:{vp:4},tp:'choiceWF'}],completion:{reward:{gold:2},multiTp:['W','F']}},
 wildcard:{id:'wildcard',name:'聯合商會',ability:{pattern:'diff2B',reward:{vp:1,gold:2}},contracts:[{id:'wild-C1',pattern:'same2B',reward:{vp:1},tpDeclared:true},{id:'wild-C2',pattern:'diff3B',reward:{vp:4}},{id:'wild-C3',pattern:'AplusDiff2B',reward:{vp:4,gold:2}}],completion:{reward:{gold:4},tp:'wild'}}
};
const INITIAL={id:'initial',name:'Initial Dealer',ability:{pattern:'any2B',reward:{vp:1,gold:2}},contracts:[{id:'init-C1',pattern:'any2B',reward:{vp:1,gold:2}},{id:'init-C2',pattern:'diff2B',reward:{vp:1,gold:2}},{id:'init-C3',pattern:'anyA',reward:{vp:1,gold:2}},{id:'init-C4',pattern:'Aplus2B',reward:{vp:4,gold:2}}],completion:{tp:'wild'}};
const INNER={
 standard:{id:'standard',name:'工房標準化核心',type:'universal',text:'本 sector 每個 tile Build Cost -1G；每次 Outer draw +1。'},
 reflux:{id:'reflux',name:'產線回流核心',type:'universal',text:'此 sector 生產後：本次產過的元素 +1，或 +4G。'},
 water:{id:'water',name:'流體路由核心',type:'B',b:'W',text:'Sector Production 可改變 B output composition；每個有效改變 +1G。'},
 fire:{id:'fire',name:'高壓熔爐核心',type:'B',b:'F',text:'qualifying Contract 且 Fee≥5：+F；Mastery 再 +1G。'},
 earth:{id:'earth',name:'蓄能基座',type:'B',b:'E',text:'本 sector 生產後 +1 Charge；Mastery 另 +1 任意 sector Charge。'},
 wind:{id:'wind',name:'連鎖物流核心',type:'B',b:'N',text:'Combo +Wind；Mastery 再 +1G。'},
 Steam:{id:'Steam',name:'雙流混合核心',type:'A',a:'Steam',text:'Sector Production 時 W+F↔Steam，有效淨轉換 +Gold。'},
 Magma:{id:'Magma',name:'熔壓核心',type:'A',a:'Magma',text:'依 Engine Fee/Charge 狀態重複 tile 或放 Charge。'},
 Frost:{id:'Frost',name:'冷鏈協調核心',type:'A',a:'Frost',text:'Frost Contract / Combo 產 Water/Wind；Mastery 有 Fee/VP。'},
 Sandstorm:{id:'Sandstorm',name:'風積蓄能核心',type:'A',a:'Sandstorm',text:'Combo 放 Charge；無合法位置 +2G。'},
 wildcard:{id:'wildcard',name:'四象協調核心',type:'wild',text:'本 sector Production → +1 Wildcard TP。'}
};
function newGame(seed=String(Date.now()).slice(-7)){
  G={version:'v0.15-web-1.1',seed:String(seed),rngState:hashSeed(seed),uid:0,turnNumber:1,phase:'Setup',subphase:null,activePlayerId:null,initiativeOrder:['human','ai1','ai2','ai3'],gameOver:false,gameOverReason:null,tileBag:[],oneTimeMarket:[],t1OneTimeDeck:[],longTermContracts:[],longTermUsedThisTurn:{},dealerMarket:[],t1DealerDeck:[],players:[],log:[],config:deep(CFG),phaseChoices:{},buildContext:null,productionContext:null,contractContext:null,sourceGaps:deep(SOURCE_GAPS)};
  for(const b of B)for(let i=0;i<16;i++)G.tileBag.push({id:`${b}-${i+1}`,element:b});
  G.tileBag=shuffle(G.tileBag);G.players=[0,1,2,3].map(makePlayer);
  G.t1OneTimeDeck=shuffle(ONE_TIME.map(deep));for(let i=0;i<CFG.oneTimeMarketSize;i++)G.oneTimeMarket.push(G.t1OneTimeDeck.shift());
  G.longTermContracts=shuffle(LT_TEMPLATES.map(x=>({...deep(x),instanceId:uid('LT')}))).slice(0,4);
  const ds=shuffle(Object.keys(DEALERS));G.dealerMarket=ds.slice(0,3);G.t1DealerDeck=ds.slice(3);
  log('setup','新遊戲 Setup 完成',{seed,sourceGaps:SOURCE_GAPS});startPrivilegeSelection();render();
}

 if(s.inner?.id==='reflux')await refluxChoice(p,ctx);
 // Earth inner charges before Pointer Charge
 if(s.inner?.id==='earth'){await placeChargeChoice(p,si,1,'Earth Inner');if(trackLv(p,'E')>=8)await placeChargeChoice(p,null,1,'Earth Inner Mastery')}
 // Pointer Charge (Earth Lv6A doubles)
 const pointerN=techHas(p,'E',6,'A')?2:1;await placeChargeChoice(p,un,pointerN,'Pointer Charge');
 log('sector_production_end',`${p.name} ${SNAME[si]} 完整生產結束`,{sector:si,unselected:un,produced:ctx.produced,chargeConsumed:ctx.chargeConsumed,pointerAfter:deep(p.pointer),engineFee:p.engineFee});render();await drainEffects()}
function middleOutput(p,m){const es=m.pair;if(m.mode==='standard'){const o={};for(const e of es)o[e]=(o[e]||0)+1;return {resources:o}}if(m.mode==='enhance')return {resources:{[es[0]]:1},tp:es[0]};if(m.mode==='a')return {resources:{[NEIGHBOR_A[`${es[0]},${es[1]}`]]:1}};if(m.mode==='breadth')return {gold:3,feeReduce:1};return {}}
async function applyBasicOutput(p,ctx,ev,mult){const o=ev.out;if(o.resources){addRes(p,o.resources,mult);for(const [k,v] of Object.entries(o.resources))ctx.produced[k]=(ctx.produced[k]||0)+v*mult}if(o.gold){p.gold+=o.gold*mult}if(o.feeReduce){for(let i=0;i<mult;i++)reduceFee(p,o.feeReduce,'Breadth Enhance')}if(o.tp){for(let i=0;i<mult;i++)gainTP(p,o.tp,1,'B Enhance')}ctx.baseEvents.push({tile:ev.tile.id,out:o,mult})}
function chargeRepeatCount(p,si,ev){if(techHas(p,'E',10,'B')&&p.sectors[si].inner?.id==='earth')return 2;return 1}
function waterRouting(p,outs,limit){if(p.type==='ai')return Promise.resolve(outs);let flat=[];outs.forEach((ev,ei)=>{if(ev.out.resources)for(const [r,n] of Object.entries(ev.out.resources))if(B.includes(r))for(let j=0;j<n;j++)flat.push({ei,from:r})});if(!flat.length||limit<=0)return Promise.resolve(outs);return new Promise(resolve=>{effectQueue.push({kind:'waterRouting',pid:p.id,outs,flat,limit,resolve});drainEffects()})}
function optionalGoldForWater(p,ctx){if(p.type==='ai'){let n=Math.min(2,p.gold>=6?1:0);p.gold-=n;p.resources.W+=n;ctx.produced.W+=n;return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'w3a',pid:p.id,ctx,resolve});drainEffects()})}
function optionalAProduction(p,a){if(p.type==='ai'){let pay=p.gold>=8?4:p.gold>=4?2:0;p.gold-=pay;p.resources[a]+=pay/2;return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'a2',pid:p.id,a,resolve});drainEffects()})}
function optionalFreeReverse(p){if(p.type==='ai'){if(rng()<.5){p.pointer.direction=p.pointer.direction==='CW'?'CCW':'CW';log('tech_action',`${p.name} Fire Lv3-B 免費 Reverse`) }return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'freeReverse',pid:p.id,resolve});drainEffects()})}
function refluxChoice(p,ctx){const actual=RES.filter(x=>ctx.produced[x]>0);if(p.type==='ai'||!actual.length){p.gold+=4;log('inner','產線回流核心 → +4G');return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'reflux',pid:p.id,opts:actual,resolve});drainEffects()})}
async function resolveProductionInner(p,ctx){const s=p.sectors[ctx.si],id=s.inner?.id;if(id==='Steam')await steamInner(p,ctx);if(id==='Magma')await magmaInner(p,ctx)}
function steamInner(p,ctx){const times=trackLv(p,'W')>=8&&trackLv(p,'F')>=8?2:1;if(p.type==='ai'){for(let i=0;i<times;i++){if(p.resources.W&&p.resources.F){p.resources.W--;p.resources.F--;p.resources.Steam++;p.gold+=p.engineFee>=5?2:1}}return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'steamInner',pid:p.id,times,resolve});drainEffects()})}
function magmaInner(p,ctx){const times=trackLv(p,'F')>=8&&trackLv(p,'E')>=8?2:1;async function once(){if(p.engineFee>=5&&ctx.chargeConsumed.length){const loc=ctx.chargeConsumed[0],s=p.sectors[loc.si],tile=loc.kind==='outer'?s.outers[loc.idx]:s.middles[loc.idx],ev={tile,kind:loc.kind,idx:loc.idx,out:loc.kind==='outer'?{resources:{[tile.element]:1}}:middleOutput(p,tile)};await applyBasicOutput(p,ctx,ev,1);log('inner','Magma Inner：重複 1 個消耗 Charge 的 tile')}else{if(p.engineFee<=4)feeIncreaseNoPay(p,2,'Magma Inner');await placeChargeChoice(p,ctx.si,1,'Magma Inner')}}let chain=Promise.resolve();for(let i=0;i<times;i++)chain=chain.then(once);return chain}
function legalChargeTargets(p,sectorIndex=null){const out=[];p.sectors.forEach((s,si)=>{if(sectorIndex!==null&&si!==sectorIndex)return;s.outers.forEach((t,i)=>{if(t&&t.charge<chargeCap(p,t,si))out.push({si,kind:'outer',idx:i})});s.middles.forEach((t,i)=>{if(t&&t.charge<chargeCap(p,t,si))out.push({si,kind:'middle',idx:i})})});return out}
function chargeCap(p,t,si){return CFG.chargeCap+(techHas(p,'E',10,'A')?1:0)}
function placeChargeAt(p,q,reason){const t=q.kind==='outer'?p.sectors[q.si].outers[q.idx]:p.sectors[q.si].middles[q.idx];if(!t||t.charge>=chargeCap(p,t,q.si))return false;t.charge++;log('charge',`${p.name} 放置 Charge @ ${SNAME[q.si]} ${q.kind}${q.idx+1} (${reason})`,q);if(q.kind==='outer'&&techHas(p,'E',6,'B')){p.gold+=2;log('tech_trigger',`${p.name} Earth Lv6-B：Charge 放 Outer → +2G`)}return true}
function placeChargeChoice(p,sectorIndex,count,reason){let chain=Promise.resolve();for(let n=0;n<count;n++)chain=chain.then(()=>{const opts=legalChargeTargets(p,sectorIndex);if(!opts.length){log('charge_fail',`${p.name} 無合法位置放 Charge (${reason})`,{sectorIndex});return}if(p.type==='ai'){opts.sort((a,b)=>chargeTargetValue(p,b)-chargeTargetValue(p,a));placeChargeAt(p,opts[0],reason);return}return new Promise(resolve=>{effectQueue.push({kind:'chargePlace',pid:p.id,opts,reason,resolve});drainEffects()})});return chain}
function chargeTargetValue(p,q){const s=p.sectors[q.si],t=q.kind==='outer'?s.outers[q.idx]:s.middles[q.idx];if(q.kind==='middle')return t.mode==='a'?4:t.mode==='enhance'?3.7:3.3;return 2}
// ---------- Contracts ----------
function patternIdentities(pattern){const out=[];const combos=(arr,k,start=0,p=[])=>(k===0?out.push(p.slice()):arr.slice(start).forEach((x,j)=>combos(arr,k-1,start+j+1,[...p,x])));if(pattern==='diff2B'){combos(B,2)}else if(pattern==='diff3B'){combos(B,3)}else if(pattern==='same2B'){for(const b of B)out.push([b,b])}else if(pattern==='same3B'){for(const b of B)out.push([b,b,b])}else if(pattern==='any2B'){for(const x of B)for(const y of B)if(B.indexOf(x)<=B.indexOf(y))out.push([x,y])}else if(pattern==='anyA'){for(const a of A)out.push([a])}else if(pattern==='AplusB'){for(const a of A)for(const b of B)out.push([a,b])}else if(pattern==='Aplus2B'){for(const a of A)for(const x of B)for(const y of B)if(B.indexOf(x)<=B.indexOf(y))out.push([a,x,y])}else if(pattern==='AplusDiff2B'){for(const a of A)for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++)out.push([a,B[i],B[j]])}return out}
function paymentOptions(p,identity){let states=[{res:{},gold:0,subs:[]}];for(const slot of identity){let alts=[{res:{[slot]:1},gold:0,sub:null}];if(B.includes(slot)&&slot!=='W'&&techHas(p,'W',10,'A'))alts.push({res:{W:1},gold:0,sub:`W→${slot}`});if((slot==='Steam'||slot==='Frost')&&techHas(p,'W',6,'B'))alts.push({res:{W:2},gold:2,sub:`WW+2G→${slot}`});let ns=[];for(const s of states)for(const a of alts){const r={...s.res};for(const [k,v] of Object.entries(a.res))r[k]=(r[k]||0)+v;ns.push({res:r,gold:s.gold+a.gold,subs:[...s.subs,...(a.sub?[a.sub]:[])]})}states=ns}const uniq=new Map();for(const s of states){const key=RES.map(k=>`${k}:${s.res[k]||0}`).join('|')+`|g:${s.gold}`;if(!uniq.has(key)&&s.gold<=p.gold&&RES.every(k=>(s.res[k]||0)<=p.resources[k]))uniq.set(key,s)}return [...uniq.values()]}
function contractCandidates(p){const c=[];for(let i=0;i<G.oneTimeMarket.length;i++){const card=G.oneTimeMarket[i];for(const id of [card.req]){for(const pay of paymentOptions(p,id))c.push({kind:'oneTime',idx:i,identity:id,pay,label:`One-Time ${card.id}`})}}
 for(let i=0;i<G.longTermContracts.length;i++){const card=G.longTermContracts[i];if(G.longTermUsedThisTurn[card.instanceId])continue;for(const id of patternIdentities(card.pattern))for(const pay of paymentOptions(p,id))c.push({kind:'longTerm',idx:i,identity:id,pay,label:`Long-Term ${card.name}`})}
 const d=getDealer(p);if(d){if(!p.flags.dealerAbilityUsedTurn){const a=d.ability;const ids=a.req?[a.req]:patternIdentities(a.pattern);for(const id of ids)for(const pay of paymentOptions(p,id))c.push({kind:'dealerAbility',identity:id,pay,label:`${d.name} Ability`})}const dc=d.contracts[p.dealerProgressIndex];if(dc){const ids=dc.req?[dc.req]:patternIdentities(dc.pattern);for(const id of ids)for(const pay of paymentOptions(p,id))c.push({kind:'dealerContract',identity:id,pay,label:`${d.name} ${dc.id}`,dealerContract:dc})}}
 return c}
function getDealer(p){if(!p.currentDealer)return null;return p.currentDealer.id==='initial'?INITIAL:DEALERS[p.currentDealer.id]}
async function contractPhase(){G.phase='Contract';for(const p of G.players){p.passedOutContractPhase=false;p.qualifyingContractsThisPhase=0;p.comboState={completedDealerIds:[],comboCount:0}}G.contractContext={cursor:0,active:new Set(G.players.map(p=>p.id)),idleCycles:0};let safety=0;while(!G.gameOver&&G.contractContext.active.size&&safety++<300){const id=G.initiativeOrder[G.contractContext.cursor%4];G.contractContext.cursor++;if(!G.contractContext.active.has(id))continue;const p=player(id);G.activePlayerId=id;const legal=contractCandidates(p);if(!legal.length){log('contract_skip',`${p.name} 無 legal Contract action，auto-skip`);G.contractContext.idleCycles++;if(G.contractContext.idleCycles>=G.contractContext.active.size){break}continue}G.contractContext.idleCycles=0;if(p.type==='human'){const choice=await humanContractChoice(p,legal);if(choice==='pass'){p.passedOutContractPhase=true;G.contractContext.active.delete(p.id);continue}await resolveContractAction(p,choice)}else{const choice=aiContractChoice(p,legal);if(!choice||choice.score<-.5){G.contractContext.active.delete(p.id);log('contract_pass',`${p.name} Pass Out`,{best:choice});continue}await resolveContractAction(p,choice)}render();await drainEffects()}if(safety>=300)throw new Error('Contract safety limit');if(!G.gameOver)await contractPhaseEndTriggers();G.contractContext=null;render()}
function humanContractChoice(p,legal){return new Promise(resolve=>{humanWait={kind:'contract',resolve,pid:p.id};let by=new Map();for(const x of legal){const key=x.kind+'|'+(x.idx??'')+'|'+(x.dealerContract?.id||'');if(!by.has(key))by.set(key,[]);by.get(key).push(x)}let h=`<b>${p.name} Contract action</b><div class="sub">每次只做 1 action；Pass Out 後本 Phase 不回來。Transition 可先從下方工具執行。</div>`;for(const [k,arr] of by){const x=arr[0];h+=`<div class="choice legal" onclick="showPaymentGroup('${encodeURIComponent(k)}')"><b>${x.label}</b><div class="tiny">${arr.length} 種合法 declared/payment 組合</div></div>`}h+=`<button class="btn bad" onclick="humanContractPass()">Pass Out</button>`;h+=transitionButtons(p);document.getElementById('decisionBody').innerHTML=h;window._contractGroups=Object.fromEntries([...by].map(([k,v])=>[k,v]));render()})}
function showPaymentGroup(enc){const k=decodeURIComponent(enc),arr=window._contractGroups[k];let h='<b>選 Requirement Identity / actual payment</b>';arr.forEach((x,i)=>{h+=`<div class="choice legal" onclick="humanContractPick('${encodeURIComponent(k)}',${i})"><div>Identity: <span class="req">${reqTxt(x.identity)}</span></div><div>Payment: <span class="req">${paymentTxt(x.pay)}</span></div>${x.pay.subs.length?`<div class="tiny">Substitution: ${x.pay.subs.join(', ')}</div>`:''}</div>`});h+='<button class="btn" onclick="humanContractBack()">Back</button>';document.getElementById('decisionBody').innerHTML=h}
function humanContractPick(enc,i){const k=decodeURIComponent(enc),x=window._contractGroups[k][i],w=humanWait;if(!w)return;humanWait=null;w.resolve(x)}function humanContractBack(){if(humanWait){const p=player(humanWait.pid);humanContractChoiceRepaint(p)}}function humanContractChoiceRepaint(p){const old=humanWait.resolve;humanWait=null;humanContractChoice(p,contractCandidates(p)).then(old)}function humanContractPass(){const w=humanWait;if(!w)return;humanWait=null;w.resolve('pass')}
function aiContractChoice(p,legal){let scored=legal.map(x=>({...x,score:scoreContract(p,x)})).sort((a,b)=>b.score-a.score);log('ai_eval',`${p.name} Contract candidates`,{top:scored.slice(0,8).map(x=>({label:x.label,identity:x.identity,pay:x.pay,score:x.score}))});return scored[0]}
function scoreContract(p,x){let r=contractRewardPreview(p,x),payV=Object.entries(x.pay.res).reduce((s,[k,v])=>s+v*(B.includes(k)?1:2),0)+x.pay.gold*.5;let v=(r.vp||0)+(r.gold||0)*.5+(r.tp||0)*1.1-payV;if(x.kind==='dealerContract')v+=2.1;if(x.kind==='oneTime')v+=6.0;if(x.kind==='longTerm')v-=0.6;if(x.kind==='dealerAbility')v-=1.0;if(x.kind!=='oneTime'){const demand={};for(const c of G.oneTimeMarket)for(const r of c.req)demand[r]=(demand[r]||0)+1;for(const [r,n] of Object.entries(x.pay.res))v-=n*(demand[r]||0)*.75;}return v}
function contractRewardPreview(p,x){let reward={vp:0,gold:0,tp:0};let card=x.kind==='oneTime'?G.oneTimeMarket[x.idx]:x.kind==='longTerm'?G.longTermContracts[x.idx]:x.kind==='dealerContract'?x.dealerContract:getDealer(p)?.ability;if(card?.reward){reward.vp+=card.reward.vp||0;reward.gold+=card.reward.gold||0}if(card?.tp)reward.tp++;return reward}
async function resolveContractAction(p,x){const feeBefore=p.engineFee,resourcesBefore=deep(p.resources),goldBefore=p.gold;if(!spendRes(p,x.pay.res)||p.gold<x.pay.gold)throw new Error('illegal payment');p.gold-=x.pay.gold;let card=null,type=x.kind,combo=false;if(type==='oneTime'){card=G.oneTimeMarket[x.idx]}else if(type==='longTerm'){card=G.longTermContracts[x.idx]}else if(type==='dealerAbility'){card=getDealer(p).ability;p.flags.dealerAbilityUsedTurn=true}else if(type==='dealerContract'){card=x.dealerContract;const d=getDealer(p);if(card.comboPrev&&p.comboState.completedDealerIds.includes(card.comboPrev)){combo=true;p.comboState.comboCount++}}
 const actualPaid=deep(x.pay.res);applyReward(p,card.reward);if(card.tp){if(card.tpDeclared)gainTP(p,x.identity[0],1,'Dealer declared TP');else gainTP(p,card.tp,1,type)}
 if(type==='oneTime')await oneTimeSpecial(p,card);if(type==='dealerContract')await dealerContractSpecial(p,card,combo);
 const isContract=type!=='dealerAbility',qualifying=type==='oneTime'||type==='dealerContract';if(qualifying)p.qualifyingContractsThisPhase++;
 if(isContract)await contractTechTriggers(p,x.identity,actualPaid,qualifying,combo,type);
 if(combo)await comboTriggers(p,x.identity);
 if(type==='longTerm')G.longTermUsedThisTurn[G.longTermContracts[x.idx].instanceId]=true;
 if(type==='oneTime'){const removed=G.oneTimeMarket.splice(x.idx,1)[0];if(G.t1OneTimeDeck.length)G.oneTimeMarket.push(G.t1OneTimeDeck.shift());log('one_time_market',`${removed.id} 完成；market ${G.oneTimeMarket.length}，deck ${G.t1OneTimeDeck.length}`)}
 if(type==='dealerContract'){p.comboState.completedDealerIds.push(card.id);p.dealerProgressIndex++;const d=getDealer(p);if(p.dealerProgressIndex>=d.contracts.length)await completeDealer(p,d)}
 log('contract_action',`${p.name} ${x.label}`,{type,declaredRequirement:x.identity,requirementIdentity:x.identity,actualPayment:{resources:x.pay.res,gold:x.pay.gold},before:{gold:goldBefore,resources:resourcesBefore,engineFee:feeBefore},after:{gold:p.gold,resources:deep(p.resources),engineFee:p.engineFee},combo,oneTimeDeck:G.t1OneTimeDeck.length,oneTimeMarket:G.oneTimeMarket.length});await drainEffects();
 if(type==='oneTime'&&G.t1OneTimeDeck.length===0&&G.oneTimeMarket.length===0){G.gameOver=true;G.gameOverReason='T1_ONE_TIME_DECK_EXHAUSTED';log('game_over','最後一張 T1 One-Time 完整結算：立即 game-over');showGameOver()}}
function applyReward(p,r={}){p.vp+=r.vp||0;p.gold+=r.gold||0;if(r.resources)addRes(p,r.resources)}
async function oneTimeSpecial(p,c){if(c.special==='fee5plus'&&p.engineFee>=5){p.vp++;p.gold+=2}if(c.special==='feeMinus1')reduceFee(p,1,'OT08');if(c.special==='fee5vp'&&p.engineFee>=5)p.vp+=2;if(c.special==='fee0ThenMinus'){const z=p.engineFee===0;if(z){p.vp+=2;p.gold++}reduceFee(p,1,'OT19')}}
async function dealerContractSpecial(p,c,combo){if(c.special==='fireDealerC3'&&p.engineFee>=5&&p.resources.F>0)await optionalFireDealerBurn(p);if(combo){if(c.feeZeroVp&&p.engineFee===0)p.vp+=c.feeZeroVp;if(c.feeReduce)reduceFee(p,c.feeReduce,`${c.id} Combo`)}if(c.charge)await placeChargeChoice(p,null,c.charge,c.id)}
function optionalFireDealerBurn(p){if(p.type==='ai'){p.resources.F--;p.vp+=2;return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'fireDealerBurn',pid:p.id,resolve});drainEffects()})}
async function completeDealer(p,d){const comp=d.completion||{};const snap=p.engineFee;applyReward(p,comp.reward);if(comp.tp)gainTP(p,comp.tp,1,'Dealer Completion');if(comp.multiTp)for(const t of comp.multiTp)gainTP(p,t,1,'Dealer Completion');if(comp.special==='fireDealerCompletion'&&snap>=5)p.vp+=2;if(comp.feeReduce)reduceFee(p,comp.feeReduce,'Dealer Completion');if(comp.charge)await placeChargeChoice(p,null,comp.charge,'Dealer Completion');log('dealer_complete',`${p.name} 完成 ${d.name}`,{dealer:d.id});p.currentDealer=null;p.dealerProgressIndex=0;await chooseNewDealer(p)}
function chooseNewDealer(p){if(G.t1DealerDeck.length)G.dealerMarket.push(G.t1DealerDeck.shift());if(!G.dealerMarket.length){log('dealer_exhaustion',`${p.name} 無 Dealer 可選；保持無 currentDealer`);return Promise.resolve()}if(p.type==='ai'){let idx=Math.floor(rng()*G.dealerMarket.length),id=G.dealerMarket.splice(idx,1)[0];p.currentDealer={id};log('dealer_acquire',`${p.name} 取得 ${DEALERS[id].name}`);return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'dealerChoose',pid:p.id,resolve});drainEffects()})}
async function contractTechTriggers(p,identity,paid,qualifying,combo,type){const contains=x=>identity.includes(x);if(contains('W')&&techHas(p,'W',6,'A'))p.resources.W++;if(contains('W')&&techHas(p,'W',10,'B')){const n=identity.filter(x=>x==='W').length;for(let i=0;i<n;i++)await chooseBonusB(p,'Water Lv10-B')}if(qualifying&&techHas(p,'F',6,'A')&&p.engineFee>=5)p.vp+=2;if(contains('F')&&techHas(p,'F',6,'B')&&p.resources.F>0)await optionalFire6B(p);if(qualifying&&techHas(p,'N',6,'A')&&p.qualifyingContractsThisPhase>=4){const bs=identity.filter(x=>B.includes(x));if(bs.length){if(p.type==='ai')p.resources[bs[0]]++;else await chooseFromList(p,bs,'Wind Lv6-A：取得 identity 中任意 1B',x=>p.resources[x]++)}}if(qualifying&&techHas(p,'N',6,'B'))reduceFee(p,1,'Wind Lv6-B');
 if(qualifying&&contains('Steam')&&aTechOn(p,'Steam',5)&&p.resources.Steam>0)await steamBurn(p,1,false);if(qualifying&&aTechOn(p,'Steam',9)&&p.resources.Steam>0)await steamBurn(p,Math.min(2,p.resources.Steam),true);
 if(qualifying&&contains('Frost')&&aTechOn(p,'Frost',5)){const n=paid.Frost||0;p.resources.W+=n;p.gold+=n}if(qualifying&&contains('Frost')&&aTechOn(p,'Frost',9))p.resources.Frost++;
 if(isAnyContract(type)&&aTechOn(p,'Magma',9)&&p.resources.Magma>0)await magmaBurn(p);
 if(qualifying&&contains('Sandstorm')&&aTechOn(p,'Sandstorm',5))await sandstorm5(p)
}
function isAnyContract(type){return ['oneTime','longTerm','dealerContract'].includes(type)}
function optionalFire6B(p){if(p.type==='ai'){p.resources.F--;p.vp++;p.gold++;return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'fire6b',pid:p.id,resolve});drainEffects()})}
function steamBurn(p,max,is9){if(p.type==='ai'){const n=Math.min(max,p.resources.Steam,p.gold>2?1:0);p.resources.Steam-=n;p.vp+=2*n;p.resources.W+=n;if(is9&&p.engineFee>=5)p.gold+=n;return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'steamBurn',pid:p.id,max,is9,resolve});drainEffects()})}
function magmaBurn(p){const max=p.engineFee>=5?Math.min(2,p.resources.Magma):1;if(p.type==='ai'){const n=max;p.resources.Magma-=n;p.vp+=2*n;p.gold+=2*n;return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'magmaBurn',pid:p.id,max,resolve});drainEffects()})}
function sandstorm5(p){if(p.type==='ai'){if(p.engineFee>=2)reduceFee(p,4,'Sandstorm Lv5');else return placeChargeChoice(p,null,1,'Sandstorm Lv5');return Promise.resolve()}return new Promise(resolve=>{effectQueue.push({kind:'sand5',pid:p.id,resolve});drainEffects()})}
async function comboTriggers(p,identity){if(techHas(p,'N',3,'B'))p.gold+=2;for(const s of p.sectors){if(s.inner?.id==='wind'){p.resources.N++;if(trackLv(p,'N')>=8)p.gold++}if(s.inner?.id==='Frost'){p.resources.N++;if(trackLv(p,'W')>=8&&trackLv(p,'N')>=8){if(p.engineFee===0)p.vp++;else reduceFee(p,2,'Frost Inner Combo')}}if(s.inner?.id==='Sandstorm'){const n=trackLv(p,'E')>=8&&trackLv(p,'N')>=8?2:1;for(let i=0;i<n;i++){const targets=legalChargeTargets(p,i===0?p.sectors.indexOf(s):null);if(targets.length)placeChargeAt(p,targets[0],'Sandstorm Inner Combo');else p.gold+=2}}}
 if(techHas(p,'N',10,'B')){if(p.engineFee===0)p.vp+=2;else reduceFee(p,1,'Wind Lv10-B')}if(aTechOn(p,'Frost',9))p.vp++}
async function contractPhaseEndTriggers(){for(const p of G.players){const n=p.qualifyingContractsThisPhase;if(techHas(p,'N',10,'A'))p.vp+=n>=6?5:n>=4?3:n>=2?1:0;if(aTechOn(p,'Frost',9)&&n>=4)p.vp+=3;if(aTechOn(p,'Sandstorm',9)){if(n>=2){await placeChargeChoice(p,null,1,'Sandstorm Lv9');reduceFee(p,1,'Sandstorm Lv9')}if(n>=4){p.resources.Sandstorm++;p.resources.E++;p.resources.N++}if(n>=6)p.vp+=4}}await drainEffects()}
// ---------- Transition ----------
function transitionOptions(p){const o=[];for(let i=0;i<B.length;i++){const a=B[i],n1=B[(i+1)%4];if(p.resources[a]>=2)o.push({from:{[a]:2},to:n1,label:`2${BNAME[a]} → 1${BNAME[n1]}`});}const ANEIGH={Steam:['Magma','Frost'],Magma:['Steam','Sandstorm'],Sandstorm:['Magma','Frost'],Frost:['Sandstorm','Steam']};for(const a of A){if(p.resources[a]>=2){for(const to of ANEIGH[a])o.push({from:{[a]:2},to,label:`2 ${a} → 1 ${to}`})}if(p.resources[a]>=1)for(const to of PARENTS[a])o.push({from:{[a]:1},to,label:`1 ${a} → 1 ${BNAME[to]}`})}
 // Lv1 tech transitions
 const rules=[['W','A',['F','N']],['W','B',['W'],['F','N']],['F','A',['W','E']],['F','B',['F'],['W','E']],['E','A',['F','N']],['E','B',['E'],['F','N']],['N','A',['W','E']],['N','B',['N'],['W','E']]];
 for(const r of rules){const [t,ch,tos,froms]=r;if(!techHas(p,t,1,ch))continue;if(froms){for(const fr of froms)if(p.resources[fr]>=1)o.push({from:{[fr]:1},to:tos[0],label:`Tech Transition ${BNAME[fr]}→${BNAME[t]}`})}else if(p.resources[t]>=1)for(const to of tos)o.push({from:{[t]:1},to,label:`Tech Transition ${BNAME[t]}→${BNAME[to]}`})}
 return o.filter(x=>p.gold>=p.engineFee)}
function transitionButtons(p){const opts=transitionOptions(p);if(!opts.length)return '<div class="tiny">目前無可支付 Transition。</div>';return `<hr><b>Transition Rule</b><div class="tiny">先付 recipe，再付目前 Engine Fee ${p.engineFee}G，之後 Fee+1。</div>`+opts.slice(0,20).map((x,i)=>`<button class="btn" onclick="doHumanTransition(${i})">${x.label}</button>`).join('')}
function doHumanTransition(i){const p=human(),o=transitionOptions(p)[i];if(!o)return;if(!spendRes(p,o.from))return;if(!feeTrigger(p,'Transition')){addRes(p,o.from);return}p.resources[o.to]++;log('transition',`${p.name} ${o.label}`,o);render();if(G.phase==='Contract'&&humanWait?.kind==='contract')humanContractChoiceRepaint(p)}
// ---------- Effect queue UI ----------
async function drainEffects(){if(processingEffects)return;processingEffects=true;while(effectQueue.length&&!G.gameOver){const e=effectQueue.shift();await showEffect(e)}processingEffects=false;render()}
let processingEffects=false;
function showEffect(e){const p=player(e.pid);if(!p||p.type==='ai')return Promise.resolve();return new Promise(done=>{let h='';const finish=()=>{done()};window._effectDone=finish;window._effect=e;
 if(e.kind==='tpChoice'){h=`<b>Tech Point 選擇</b><div>${e.source||''}</div>`+e.opts.map(t=>`<button class="btn" onclick="effectTP('${t}')">${BNAME[t]}</button>`).join('')}
 else if(e.kind==='techChoice'){h=`<b>${BNAME[e.t]} Lv${e.lv} 二選一</b><button class="btn" onclick="effectTech('A')">A</button><button class="btn" onclick="effectTech('B')">B</button>`}
 else if(e.kind==='w3a'){h=`<b>Water Lv3-A 加壓供水</b><div>可支付最多 2G，每 1G 得 1W。</div>`+[0,1,2].map(n=>`<button class="btn" ${p.gold<n?'disabled':''} onclick="effectW3A(${n})">付 ${n}G</button>`).join('')}
 else if(e.kind==='a2'){h=`<b>${e.a} Lv2</b><div>每 2G 得 1 ${e.a}，最多 2。</div>`+[0,2,4].map(n=>`<button class="btn" ${p.gold<n?'disabled':''} onclick="effectA2(${n})">付 ${n}G</button>`).join('')}
 else if(e.kind==='freeReverse'){h=`<b>Fire Lv3-B</b><div>本次實際產出 ≥4F，可立即免費 Reverse Pointer。</div><button class="btn good" onclick="effectFreeReverse(true)">Reverse</button><button class="btn" onclick="effectFreeReverse(false)">不 Reverse</button>`}
 else if(e.kind==='reflux'){h=`<b>產線回流核心</b><button class="btn" onclick="effectReflux('G')">+4G</button>`+e.opts.map(x=>`<button class="btn" onclick="effectReflux('${x}')">+1 ${ICON[x]||x}</button>`).join('')}
 else if(e.kind==='chargePlace'){h=`<b>放置 Charge｜${e.reason}</b>`+e.opts.map((q,i)=>`<button class="btn" onclick="effectCharge(${i})">${SNAME[q.si]} ${q.kind}${q.idx+1}</button>`).join('')}
 else if(e.kind==='dealerChoose'){h=`<b>選擇新 Dealer</b>`+G.dealerMarket.map((id,i)=>`<div class="choice legal" onclick="effectDealer(${i})"><b>${DEALERS[id].name}</b></div>`).join('')}
 else if(e.kind==='fireDealerBurn'){h=`<b>Fire Dealer C3</b><div>Fee≥5：可額外支付 1F → +2VP。</div><button class="btn" onclick="effectFireDealer(true)">支付</button><button class="btn" onclick="effectFireDealer(false)">不支付</button>`}
 else if(e.kind==='fire6b'){h=`<b>Fire Lv6-B</b><div>完成包含 Fire 的 Contract：可付 1F → +1VP+1G。</div><button class="btn" onclick="effectFire6B(true)">支付</button><button class="btn" onclick="effectFire6B(false)">不支付</button>`}
 else if(e.kind==='steamBurn'){h=`<b>Steam Tech ${e.is9?'Lv9':'Lv5'}</b>`;for(let n=0;n<=e.max;n++)h+=`<button class="btn" onclick="effectSteamBurn(${n})">支付 ${n} Steam</button>`}
 else if(e.kind==='magmaBurn'){h=`<b>Magma Lv9</b><div>每顆 +2VP+2G；高 Fee 最多 2。</div>`;for(let n=0;n<=e.max;n++)h+=`<button class="btn" onclick="effectMagmaBurn(${n})">支付 ${n}</button>`}
 else if(e.kind==='sand5'){h=`<b>Sandstorm Lv5</b><button class="btn" onclick="effectSand5('charge')">放 1 Charge</button><button class="btn" onclick="effectSand5('fee')">Engine Fee -4</button>`}
 else if(e.kind==='steamInner'){h=`<b>雙流混合核心</b><div>剩餘可執行 ${e.times} 次。</div><button class="btn" onclick="effectSteamInner('wf')">1W+1F→1Steam</button><button class="btn" onclick="effectSteamInner('s')">1Steam→1W+1F</button><button class="btn" onclick="effectSteamInner('done')">Done</button>`}
 else if(e.kind==='waterRouting'){h=`<b>流體路由核心</b><div>最多改變 ${e.limit} 個 B output。此測試 UI 以「來源→目標」逐次處理。</div><button class="btn" onclick="effectWaterRoutingDone()">不改 / Done</button>`;const seen=[...new Set(e.flat.map(x=>x.from))];for(const fr of seen)for(const to of B)if(to!==fr)h+=`<button class="btn" onclick="effectWaterRoute('${fr}','${to}')">${BNAME[fr]}→${BNAME[to]}</button>`}
 else h='<button class="btn" onclick="effectGenericDone()">OK</button>';
 document.getElementById('decisionBody').innerHTML=h;window._effectFinish=()=>{e.resolve?.();finish()}})}
function effectTP(t){const e=window._effect;applyTP(player(e.pid),t,e.source);window._effectFinish()}function effectTech(ch){const e=window._effect,p=player(e.pid);p.techChoices[`${e.t}${e.lv}`]=ch;log('tech_choice',`${p.name} ${BNAME[e.t]} Lv${e.lv} 選 ${ch}`);window._effectFinish()}
function effectW3A(n){const e=window._effect,p=player(e.pid);p.gold-=n;p.resources.W+=n;e.ctx.produced.W+=n;window._effectFinish()}function effectA2(n){const e=window._effect,p=player(e.pid);p.gold-=n;p.resources[e.a]+=n/2;window._effectFinish()}
function effectFreeReverse(y){const e=window._effect,p=player(e.pid);if(y)p.pointer.direction=p.pointer.direction==='CW'?'CCW':'CW';window._effectFinish()}function effectReflux(x){const e=window._effect,p=player(e.pid);if(x==='G')p.gold+=4;else p.resources[x]++;window._effectFinish()}
function effectCharge(i){const e=window._effect,p=player(e.pid);placeChargeAt(p,e.opts[i],e.reason);window._effectFinish()}function effectDealer(i){const e=window._effect,p=player(e.pid),id=G.dealerMarket.splice(i,1)[0];p.currentDealer={id};p.dealerProgressIndex=0;log('dealer_acquire',`${p.name} 取得 ${DEALERS[id].name}`);window._effectFinish()}
function effectFireDealer(y){const e=window._effect,p=player(e.pid);if(y&&p.resources.F){p.resources.F--;p.vp+=2}window._effectFinish()}function effectFire6B(y){const e=window._effect,p=player(e.pid);if(y&&p.resources.F){p.resources.F--;p.vp++;p.gold++}window._effectFinish()}
function effectSteamBurn(n){const e=window._effect,p=player(e.pid);n=Math.min(n,p.resources.Steam);p.resources.Steam-=n;p.vp+=2*n;p.resources.W+=n;if(e.is9&&p.engineFee>=5)p.gold+=n;window._effectFinish()}function effectMagmaBurn(n){const e=window._effect,p=player(e.pid);n=Math.min(n,p.resources.Magma);p.resources.Magma-=n;p.vp+=2*n;p.gold+=2*n;window._effectFinish()}
function effectSand5(x){const e=window._effect,p=player(e.pid);if(x==='fee'){reduceFee(p,4,'Sandstorm Lv5');window._effectFinish()}else{const opts=legalChargeTargets(p,null);if(opts.length)placeChargeAt(p,opts[0],'Sandstorm Lv5');window._effectFinish()}}
function effectSteamInner(x){const e=window._effect,p=player(e.pid);if(x==='done'||e.times<=0){window._effectFinish();return}if(x==='wf'&&p.resources.W&&p.resources.F){p.resources.W--;p.resources.F--;p.resources.Steam++;p.gold+=p.engineFee>=5?2:1;e.times--}else if(x==='s'&&p.resources.Steam){p.resources.Steam--;p.resources.W++;p.resources.F++;p.gold+=p.engineFee>=5?2:1;e.times--}if(e.times<=0)window._effectFinish();else showEffect(e)}
function effectWaterRoute(fr,to){const e=window._effect;if(e.limit<=0)return;for(const ev of e.outs){if(ev.out.resources?.[fr]>0){ev.out.resources[fr]--;ev.out.resources[to]=(ev.out.resources[to]||0)+1;e.limit--;player(e.pid).gold++;break}}if(e.limit<=0)window._effectFinish();else showEffect(e)}function effectWaterRoutingDone(){window._effectFinish()}function effectGenericDone(){window._effectFinish()}
function chooseBonusB(p,reason){if(p.type==='ai'){p.resources[leastResourceB(p)]++;return Promise.resolve()}return chooseFromList(p,B,reason,x=>p.resources[x]++)}
function chooseFromList(p,opts,title,fn){return new Promise(resolve=>{effectQueue.push({kind:'genericList',pid:p.id,opts,title,fn,resolve}); // fallback handled inline override
 const e=effectQueue.pop();e.kind='genericList';effectQueue.push(e);const oldShow=showEffect;drainEffects();resolve()})}
function leastResourceB(p){return B.slice().sort((a,b)=>p.resources[a]-p.resources[b])[0]}
// generic list helper patched via direct simple AI/human prompt
async function chooseFromList(p,opts,title,fn){if(p.type==='ai'){fn(opts[0]);return}return new Promise(resolve=>{const h=`<b>${title}</b>`+opts.map(x=>`<button class="btn" onclick="window.__listPick('${x}')">${ICON[x]||x}</button>`).join('');document.getElementById('decisionBody').innerHTML=h;window.__listPick=(x)=>{fn(x);window.__listPick=null;resolve()}})}
// ---------- Render ----------
function render(){if(!G)return;document.getElementById('phasePill').textContent=`Turn ${G.turnNumber}｜${G.phase}${G.subphase?`｜${G.subphase}`:''}${G.gameOver?'｜GAME OVER':''}`;document.getElementById('clockPill').textContent=`T1 One-Time remaining: ${G.t1OneTimeDeck.length+G.oneTimeMarket.length} (deck ${G.t1OneTimeDeck.length} + market ${G.oneTimeMarket.length})`;const hp=human();document.getElementById('pointerPill').textContent=`Human Pointer ${boundaryText(hp.pointer.boundary)}｜${hp.pointer.direction}`;document.getElementById('seedPill').textContent=`Seed ${G.seed}`;renderPlayers();renderMarkets();renderDealerMarket();renderLog();renderAssertions();if(G.gameOver)showGameOver()}
function renderPlayers(){const el=document.getElementById('players');el.innerHTML=G.players.map(p=>{const te=`W${p.tech.water}/F${p.tech.fire}/E${p.tech.earth}/N${p.tech.wind}`;const d=getDealer(p);return `<div class="player ${G.activePlayerId===p.id?'active':''}"><div style="display:flex;justify-content:space-between"><b>${p.name}</b><span>VP <b>${p.vp}</b>｜G <b>${p.gold}</b>｜Fee <b>${p.engineFee}</b></span></div><div class="res">${RES.map(r=>`<span class="r ${CLS[r]}">${ICON[r]} ${p.resources[r]}</span>`).join('')}</div><div class="tiny">Tech ${te}｜Dealer ${d?d.name:'—'} ${d?`${p.dealerProgressIndex}/${d.contracts.length}`:''}</div><div class="pointer">${boundaryText(p.pointer.boundary)}｜${p.pointer.direction}</div>${wheelHtml(p)}</div>`}).join('')}
function wheelHtml(p){return `<div class="wheel">${p.sectors.map((s,si)=>`<div class="sector"><h4><span>${SNAME[si]}</span><span>${sectorComposition(p,si).map(x=>ICON[x]).join('')}</span></h4><div class="slots">${s.outers.map((t,i)=>slotHtml(t,'O'+(i+1))).join('')}${s.middles.map((t,i)=>slotHtml(t,'M'+(i+1),true)).join('')}${slotHtml(s.inner,'Inner',false,true)}</div></div>`).join('')}</div>`}
function slotHtml(t,label,mid=false,inner=false){if(!t)return `<div class="slot ${mid?'mid':''} ${inner?'inner':''}">${label}<br>—</div>`;let text=inner?t.name:t.type==='outer'?`${ICON[t.element]} ${BNAME[t.element]}`:middleLabel(t);return `<div class="slot ${mid?'mid':''} ${inner?'inner':''}" title="${escapeHtml(JSON.stringify(t))}">${label}<br>${text}${t.charge?` <span class="charge">${t.charge}</span>`:''}</div>`}
function middleLabel(t){return {standard:'Standard',enhance:'B Enhance',a:'A Production',breadth:'Breadth'}[t.mode]||t.mode}
function renderMarkets(){document.getElementById('oneTime').innerHTML=G.oneTimeMarket.map((c,i)=>`<div class="mcard"><strong>${c.id}</strong><div class="req">${reqTxt(c.req)}</div><div class="reward">${rewardText(c)}</div></div>`).join('')||'<div class="sub">No One-Time cards remain.</div>';document.getElementById('longTerm').innerHTML=G.longTermContracts.map(c=>`<div class="mcard ${G.longTermUsedThisTurn[c.instanceId]?'used':''}"><strong>${c.name}</strong><div class="req">${c.pattern}</div><div class="reward">${rewardObjText(c.reward)}</div><div class="tiny">${G.longTermUsedThisTurn[c.instanceId]?'本 Turn 已使用':'可用'}</div></div>`).join('')}
function renderDealerMarket(){document.getElementById('dealerMarket').innerHTML=G.dealerMarket.map(id=>{const d=DEALERS[id];return `<div class="dealer"><b>${d.name}</b><div class="tiny">Ability ${d.ability.req?reqTxt(d.ability.req):d.ability.pattern}</div><div>${d.contracts.map((c,i)=>`C${i+1}: ${c.req?reqTxt(c.req):c.pattern}`).join('<br>')}</div></div>`}).join('')||'<div class="sub">Dealer market empty (TEST RULE: no refill / no reshuffle).</div>'}
function rewardText(c){return rewardObjText(c.reward)+(c.tp?`｜TP ${c.tp}`:'')+(c.special?`｜${c.special}`:'')}function rewardObjText(r={}){return `${r.vp?`${r.vp}VP `:''}${r.gold?`${r.gold}G`:''}`.trim()||'—'}function reqTxt(a){return a.map(x=>ICON[x]||x).join(' + ')}function paymentTxt(p){return `${resTxt(p.res)}${p.gold?` + ${p.gold}G`:''}`}
function renderLog(){if(!G)return;const el=document.getElementById('log');el.innerHTML=G.log.slice(-180).reverse().map(x=>`<div class="logline">#${x.id} T${x.turn} [${x.phase}] ${escapeHtml(x.msg)}</div>`).join('')}
function renderAssertions(){const errs=runtimeAssertions();document.getElementById('assertions').innerHTML=errs.length?`<span style="color:var(--bad)">ASSERT FAIL: ${errs.join('；')}</span>`:`<span style="color:var(--good)">Runtime assertions OK</span>`}
function runtimeAssertions(){const e=[];for(const p of G.players){if(p.gold<0)e.push(`${p.name} gold<0`);for(const r of RES)if(p.resources[r]<0)e.push(`${p.name} ${r}<0`);if(p.engineFee<0||p.engineFee>feeCap(p))e.push(`${p.name} fee out of cap`);for(const s of p.sectors)for(const t of [...s.outers,...s.middles])if(t&&t.charge>chargeCap(p,t,p.sectors.indexOf(s)))e.push(`${p.name} charge cap`)}if(G.gameOver&&G.phase==='Privilege')e.push('gameOver created new privilege state');return e}
function showGameOver(){const o=document.getElementById('overlay');o.classList.add('show');document.getElementById('overlayBody').innerHTML=`<h2 class="gameover">T1 GAME OVER</h2><div class="summary">Reason: ${G.gameOverReason}</div>${G.players.slice().sort((a,b)=>b.vp-a.vp).map(p=>`<div class="choice"><b>${p.name}</b>｜VP ${p.vp}｜G ${p.gold}｜Fee ${p.engineFee}｜${resTxt(p.resources)}</div>`).join('')}<div class="actions"><button class="btn" onclick="downloadState()">Export JSON</button><button class="btn" onclick="downloadLog()">Export Log</button><button class="btn" onclick="document.getElementById('overlay').classList.remove('show')">Close</button></div>`}
function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function download(name,obj){const blob=new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function downloadState(){download(`contract_branch_v015_state_seed_${G.seed}.json`,G)}function downloadLog(){download(`contract_branch_v015_log_seed_${G.seed}.json`,G.log)}
function importStateFile(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const x=JSON.parse(rd.result);G=x;effectQueue=[];humanWait=null;processing=false;log('import','Imported state');render();resumeImportedState()};rd.readAsText(f)}
function resumeImportedState(){if(G.gameOver){showGameOver();return}if(G.phase==='Privilege'){showPrivilegeDecision();return}document.getElementById('decisionBody').innerHTML='<div class="testdefault">Imported mid-phase state loaded. Use End Current Phase / debug or restart same seed if a human decision continuation was not serialized.</div>'}
function restartSameSeed(){newGame(G.seed)}function copyLatestState(){navigator.clipboard?.writeText(JSON.stringify({turn:G.turnNumber,phase:G.phase,remaining:G.t1OneTimeDeck.length+G.oneTimeMarket.length,players:G.players.map(p=>({name:p.name,vp:p.vp,gold:p.gold,fee:p.engineFee,res:p.resources,tech:p.tech,dealer:p.currentDealer}))},null,2))}
function debugResources(){const p=human(),v=prompt('輸入 W,F,E,N,Steam,Magma,Sandstorm,Frost,Gold，例如 3,3,3,3,1,1,1,1,20');if(!v)return;const a=v.split(',').map(Number);['W','F','E','N','Steam','Magma','Sandstorm','Frost'].forEach((r,i)=>p.resources[r]=a[i]||0);p.gold=a[8]||0;log('debug','Set Human resources');render()}

function debugFee(){const n=Number(prompt('Engine Fee 0-10',human().engineFee));if(Number.isFinite(n))human().engineFee=Math.max(0,Math.min(feeCap(human()),n));render()}function debugPointer(){const p=human(),b=Number(prompt('Boundary index: 0=W|F,1=F|E,2=E|Wind,3=Wind|W',p.pointer.boundary));const d=prompt('Direction CW / CCW',p.pointer.direction);if([0,1,2,3].includes(b))p.pointer.boundary=b;if(['CW','CCW'].includes(d))p.pointer.direction=d;render()}function debugCharge(){const p=human(),opts=legalChargeTargets(p,null);if(opts[0])placeChargeAt(p,opts[0],'DEBUG');render()}function debugEndGame(){G.gameOver=true;G.gameOverReason='DEBUG_ONLY';log('debug','TEST ONLY End Game');showGameOver()}
