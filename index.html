<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>元素管道：術式工房 — Integration Alpha v0.6 Prototype C</title>
<style>
  :root{--bg:#11151b;--panel:#1a212b;--panel2:#202936;--line:#334155;--text:#e5edf7;--muted:#9fb0c3;--accent:#6ea8fe;--good:#77dd77;--warn:#ffd166;--bad:#ff6b6b;--hex:42px}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
  button,select,input{font:inherit} button{cursor:pointer}
  .sticky{position:sticky;top:0;z-index:20;background:rgba(17,21,27,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .top{padding:10px 14px}.topline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#18202a}.phasebar{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.phase{padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:#17202a;color:var(--muted)}.phase.on{color:white;border-color:#537aa8;background:#1f3349}.phase.now{outline:2px solid var(--accent)}
  .wrap{padding:14px;display:grid;gap:14px}.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.section h2,.section h3{margin:0 0 10px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.primary{background:#2a6fdb;color:#fff;border:0;border-radius:9px;padding:8px 12px}.secondary{background:#273241;color:#fff;border:1px solid #425269;border-radius:9px;padding:8px 12px}.danger{background:#4a2227;color:#ffd9dd;border:1px solid #7b343c;border-radius:9px;padding:8px 12px}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
  .players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.player{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}.player.me{border-color:#5a7ea7}.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.res{padding:5px 7px;background:#151c25;border-radius:7px;border:1px solid #2c3848;font-size:13px}.res small{color:var(--muted)}
  .spells{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:9px}.spell{background:#151c25;border:1px solid #36465b;border-radius:9px;padding:8px;font-size:13px}.spell.used{opacity:.55}.spell .title{display:flex;justify-content:space-between;gap:6px;font-weight:700}.recipe{color:#c9d6e4;margin-top:4px}.recipe.lock{opacity:.45}.spell button{margin-top:6px;width:100%;padding:5px;border-radius:7px;border:1px solid #43556d;background:#24364b;color:#fff}
  .middle{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.boardWrap{overflow:auto;min-height:620px}.board{position:relative;width:610px;height:570px;margin:auto}.hex{position:absolute;width:calc(var(--hex)*1.732);height:calc(var(--hex)*2);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:#273445;border:0;color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:11px}.hex::after{content:"";position:absolute;inset:2px;clip-path:inherit;background:#1b2531;z-index:-1}.hex.legal{background:#55a86b}.hex.occupied{background:#53657a}.hex.center{background:#6a57a6}.hex.water{background:#3e76b8}.hex.fire{background:#a95143}.hex.earth{background:#6a8b45}.hex.wind{background:#6f8f9f}.hex.prod{background:#8c6b3d}.hex:hover{filter:brightness(1.15)}
  .markets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.market{background:#151c25;border:1px solid #344357;border-radius:10px;padding:9px}.cards{display:grid;gap:7px}.tilecard,.choice{padding:8px;border:1px solid #42536a;border-radius:8px;background:#202b38}.tilecard button{margin-top:6px;width:100%}.hand{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:6px 8px;background:#18212c;border:1px solid #344357;border-radius:8px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modal.show{display:flex}.modalbox{max-width:1000px;width:100%;max-height:88vh;overflow:auto;background:#17202a;border:1px solid #42536a;border-radius:14px;padding:14px}.choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.choice.selected{outline:2px solid var(--accent)}
  .log{height:230px;overflow:auto;background:#0e141b;border:1px solid #2c3848;border-radius:9px;padding:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap}.muted{color:var(--muted)} .notice{padding:8px;border-left:3px solid var(--warn);background:#2c291e;border-radius:6px}.ok{color:var(--good)} .bad{color:var(--bad)}
  @media(max-width:1050px){.players{grid-template-columns:1fr}.middle{grid-template-columns:1fr}.boardWrap{min-height:600px}}
</style>
</head>
<body>
<div class="sticky"><div class="top">
  <div class="topline">
    <strong>元素管道：術式工房 v0.6 Prototype C</strong>
    <span class="pill">Round <b id="round">1</b>/8</span>
    <span class="pill">Seed <b id="seedLabel"></b></span>
    <span class="pill">目前：<b id="status">初始化</b></span>
  </div>
  <div class="phasebar" id="phasebar"></div>
  <div id="reveals" class="muted" style="margin-top:7px"></div>
</div></div>
<div class="wrap">
  <div class="section">
    <div class="controls">
      <label>Seed <input id="seedInput" value="alpha-v06" style="width:130px"></label>
      <button class="secondary" id="newGame">新遊戲</button>
      <button class="primary" id="startRound">選擇本回合 Phase</button>
      <button class="secondary" id="exportJson">Export JSON</button>
      <button class="secondary" id="exportCsv">Export CSV</button>
    </div>
    <div class="notice" style="margin-top:8px">修正版：先建立遊戲，再於第一次開始回合時完成起始術式設定。Tech / T3 / 終局 Gold→VP 不啟用。</div><div id="errorBox" class="notice" style="display:none;margin-top:8px;border-left-color:var(--bad);background:#321e22"></div>
  </div>

  <div id="players" class="players"></div>

  <div class="middle">
    <div class="section boardWrap">
      <h2>你的 Hex 工房</h2>
      <div class="muted">建造時合法位置會亮起。中心固定為元素汲取井。點選手牌板塊後再點合法 Hex。</div>
      <div id="board" class="board"></div>
    </div>
    <div class="section">
      <h2>市場 / 手牌</h2>
      <div class="markets">
        <div class="market"><h3>T1 Element Market</h3><div id="market1" class="cards"></div></div>
        <div class="market"><h3>T2 Production Market</h3><div id="market2" class="cards"></div></div>
      </div>
      <h3 style="margin-top:12px">你的 Tile Hand (<span id="handCount">0</span>/3)</h3>
      <div id="hand" class="hand"></div>
      <div class="muted" style="margin-top:8px">Build phase 中可建任意數量，只要付得起。T1 2G，T2 4G；折價特權每片 -1G。</div>
    </div>
  </div>

  <div class="section"><h2>測試紀錄</h2><div id="log" class="log"></div></div>
</div>

<div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="controls" style="margin-top:12px"><button class="primary" id="modalConfirm">確認</button><button class="secondary" id="modalCancel">取消</button></div></div></div>

<script>
(() => {
const BASE=['water','fire','earth','wind'];
const ADV=['steam','magma','sandstorm','frost'];
const EM={water:'💧水',fire:'🔥火',earth:'🌱土',wind:'🌪️風',steam:'💨蒸氣',magma:'🌋熔岩',sandstorm:'⏳沙暴',frost:'❄️冰晶'};
const PARENTS={steam:['water','fire'],magma:['fire','earth'],sandstorm:['earth','wind'],frost:['wind','water']};
const OPPB=[['water','earth'],['fire','wind']]; const NEI=[['water','fire'],['fire','earth'],['earth','wind'],['wind','water']]; const OPPA=[['steam','sandstorm'],['magma','frost']];
const PHASES=['Funding','Build','Study','Production'];
let S=null, buildSelection=null, modalResolve=null;

function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rng(){return S.rng()}
function shuffle(a, rand){const r=rand||rng;for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clone(x){return JSON.parse(JSON.stringify(x))}
function log(msg,obj){const e={t:new Date().toISOString(),round:S?.round||0,msg,...(obj||{})};S?.logs.push(e);document.getElementById('log').textContent += `[R${e.round}] ${msg}\n`;const l=document.getElementById('log');l.scrollTop=l.scrollHeight}

function mkSpell(id,tier,proto,name,arch,recipes){return {id,tier,prototype:proto,name,archetype:arch,recipes}}
function rc(cost,gold=0,vp=0,label=''){return {cost,reward:{gold,vp},label}}
function spells(){const a=[];
  BASE.forEach(b=>a.push(mkSpell(`T1-01-${b}`,1,'T1-01',`元素販售・${EM[b]}`,'single-b',{1:[rc({[b]:1},2)],2:[rc({[b]:2},4)],3:[rc({[b]:3},6)]})));
  NEI.forEach(([x,y])=>a.push(mkSpell(`T1-02-${x}-${y}`,1,'T1-02',`元素批發・${EM[x]}${EM[y]}`,'neighbor-pair',{1:[rc({[x]:1,[y]:1},4)],2:[rc({[x]:2,[y]:1},6,0,`${EM[x]}x2+${EM[y]}`),rc({[x]:1,[y]:2},6,0,`${EM[x]}+${EM[y]}x2`)],3:[rc({[x]:2,[y]:2},8)]})));
  OPPB.forEach(([x,y])=>{const rem=BASE.filter(z=>z!==x&&z!==y);a.push(mkSpell(`T1-03-${x}-${y}`,1,'T1-03',`混合交易・${EM[x]}${EM[y]}`,'opposite-b',{1:[rc({[x]:1,[y]:1},4)],2:rem.map(z=>rc({[x]:1,[y]:1,[z]:1},6)),3:[rc({water:1,fire:1,earth:1,wind:1},8)]}))});
  OPPB.forEach(([x,y])=>{const rem=BASE.filter(z=>z!==x&&z!==y);a.push(mkSpell(`T1-04-${x}-${y}`,1,'T1-04',`基礎委託・${EM[x]}${EM[y]}`,'opposite-b',{1:[rc({[x]:1,[y]:1},2,1)],2:rem.map(z=>rc({[x]:1,[y]:1,[z]:1},2,2)),3:[rc({water:1,fire:1,earth:1,wind:1},2,3)]}))});
  BASE.forEach(b=>a.push(mkSpell(`T1-05-${b}`,1,'T1-05',`專門訂單・${EM[b]}`,'single-b',{1:[rc({[b]:2},2,1)],2:[rc({[b]:3},4,1)],3:[rc({[b]:4},4,2)]})));
  NEI.forEach(([x,y])=>a.push(mkSpell(`T1-06-${x}-${y}`,1,'T1-06',`雙元素訂單・${EM[x]}${EM[y]}`,'neighbor-pair',{1:[rc({[x]:1,[y]:1},2,1)],2:[rc({[x]:2,[y]:1},4,1),rc({[x]:1,[y]:2},4,1)],3:[rc({[x]:2,[y]:2},4,2)]})));
  const nmap={water:['fire','wind'],fire:['water','earth'],earth:['fire','wind'],wind:['earth','water']}; BASE.forEach(b=>{const [x,y]=nmap[b];a.push(mkSpell(`T1-07-${b}`,1,'T1-07',`元素連鎖・${EM[b]}`,'bridge',{1:[rc({[b]:1},2)],2:[rc({[b]:1,[x]:1},2,1),rc({[b]:1,[y]:1},2,1)],3:[rc({[b]:1,[x]:1,[y]:1},2,2)]}))});
  OPPB.forEach(([x,y])=>{const rem=BASE.filter(z=>z!==x&&z!==y);a.push(mkSpell(`T1-08-${x}-${y}`,1,'T1-08',`多元素供應・${EM[x]}${EM[y]}`,'opposite-b',{1:[rc({[x]:1,[y]:1},2,1)],2:rem.map(z=>rc({[x]:1,[y]:1,[z]:1},4,1)),3:[rc({water:1,fire:1,earth:1,wind:1},4,2)]}))});
  BASE.forEach(b=>a.push(mkSpell(`T1-09-${b}`,1,'T1-09',`大宗加工・${EM[b]}`,'single-b',{1:[rc({[b]:3},2,2)],2:[rc({[b]:4},4,2)],3:[rc({[b]:5},4,3)]})));
  BASE.forEach(b=>a.push(mkSpell(`T1-10-${b}`,1,'T1-10',`元素凝鍊・${EM[b]}`,'single-b',{1:[rc({[b]:2},0,2)],2:[rc({[b]:3},0,3)],3:[rc({[b]:4},0,4)]})));
  OPPB.forEach(([x,y])=>{const rem=BASE.filter(z=>z!==x&&z!==y);a.push(mkSpell(`T1-11-${x}-${y}`,1,'T1-11',`多元素共鳴・${EM[x]}${EM[y]}`,'opposite-b',{1:[rc({[x]:1,[y]:1},0,2)],2:rem.map(z=>rc({[x]:1,[y]:1,[z]:1},0,3)),3:[rc({water:1,fire:1,earth:1,wind:1},0,4)]}))});
  NEI.forEach(([x,y])=>a.push(mkSpell(`T1-12-${x}-${y}`,1,'T1-12',`雙相共鳴・${EM[x]}${EM[y]}`,'neighbor-pair',{1:[rc({[x]:1,[y]:1},0,2)],2:[rc({[x]:2,[y]:1},0,3),rc({[x]:1,[y]:2},0,3)],3:[rc({[x]:2,[y]:2},0,4)]})));
  ADV.forEach(x=>a.push(mkSpell(`T2-01-${x}`,2,'T2-01',`高階委託・${EM[x]}`,'single-a',{1:[rc({[x]:1},2,1)],2:[rc({[x]:2},4,2)],3:[rc({[x]:3},6,3)]})));
  ADV.forEach(x=>a.push(mkSpell(`T2-02-${x}`,2,'T2-02',`高階專門訂單・${EM[x]}`,'single-a',{1:[rc({[x]:2},4,2)],2:[rc({[x]:3},6,3)],3:[rc({[x]:4},8,4)]})));
  OPPA.forEach(([x,y])=>{const rem=ADV.filter(z=>z!==x&&z!==y);a.push(mkSpell(`T2-03-${x}-${y}`,2,'T2-03',`複合加工・${EM[x]}${EM[y]}`,'opposite-a',{1:[rc({[x]:1,[y]:1},4,2)],2:rem.map(z=>rc({[x]:1,[y]:1,[z]:1},6,3)),3:[rc({steam:1,magma:1,sandstorm:1,frost:1},8,4)]}))});
  ADV.forEach(x=>{const[p1,p2]=PARENTS[x];a.push(mkSpell(`T2-04-${x}`,2,'T2-04',`元素複合術・${EM[x]}`,'family',{1:[rc({[x]:1,[p1]:1},2,2),rc({[x]:1,[p2]:1},2,2)],2:[rc({[x]:1,[p1]:1,[p2]:1},4,2)],3:[rc({[x]:2,[p1]:1,[p2]:1},4,4)]}))});
  ADV.forEach(x=>a.push(mkSpell(`T2-05-${x}`,2,'T2-05',`高階凝鍊・${EM[x]}`,'single-a',{1:[rc({[x]:1},0,2)],2:[rc({[x]:2},0,4)],3:[rc({[x]:3},0,6)]})));
  ADV.forEach(x=>a.push(mkSpell(`T2-06-${x}`,2,'T2-06',`高階共鳴・${EM[x]}`,'single-a',{1:[rc({[x]:2},0,4)],2:[rc({[x]:3},0,6)],3:[rc({[x]:4},0,8)]})));
  OPPA.forEach(([x,y])=>{const rem=ADV.filter(z=>z!==x&&z!==y);a.push(mkSpell(`T2-07-${x}-${y}`,2,'T2-07',`多相共鳴・${EM[x]}${EM[y]}`,'opposite-a',{1:[rc({[x]:1,[y]:1},0,4)],2:rem.map(z=>rc({[x]:1,[y]:1,[z]:1},0,6)),3:[rc({steam:1,magma:1,sandstorm:1,frost:1},0,8)]}))});
  ADV.forEach(x=>{const[p1,p2]=PARENTS[x];a.push(mkSpell(`T2-08-${x}`,2,'T2-08',`元素交織・${EM[x]}`,'family',{1:[rc({[x]:1,[p1]:1},0,3),rc({[x]:1,[p2]:1},0,3)],2:[rc({[x]:1,[p1]:1,[p2]:1},0,4)],3:[rc({[x]:2,[p1]:1,[p2]:1},0,6)]}))});
  return a;
}
function makeTiles(){let t1=[],t2=[];for(let n=0;n<10;n++)BASE.forEach(e=>t1.push({id:`T1-${e}-${n}`,tier:1,type:'element',element:e,name:`${EM[e]}元素板塊`,cost:2}));for(let n=0;n<8;n++)ADV.forEach(e=>t2.push({id:`T2-${e}-${n}`,tier:2,type:'production',element:e,name:`${EM[e]}井`,cost:4}));return {t1,t2}}
function hexCoords(){let out=[];for(let q=-3;q<=3;q++)for(let r=Math.max(-3,-q-3);r<=Math.min(3,-q+3);r++)out.push({q,r});return out}
function key(q,r){return `${q},${r}`} const DIR=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function player(id,name,human=false){return {id,name,human,gold:4,vp:0,res:Object.fromEntries([...BASE,...ADV].map(x=>[x,0])),spells:[],hand:[],board:{'0,0':{type:'center',name:'元素汲取井'}},choice:null}}
function newGame(seed){try{document.getElementById('modal').classList.remove('show')}catch(e){};buildSelection=null;modalResolve=null;clearError();try{const all=spells(),tiles=makeTiles();const seedHash=hashSeed(seed);const sr=mulberry32(seedHash);S={seed,seedHash,rng:sr,round:1,phase:'idle',logs:[],players:[player(0,'你',true),player(1,'AI-A'),player(2,'AI-B')],spells:{1:shuffle(all.filter(x=>x.tier===1),sr),2:shuffle(all.filter(x=>x.tier===2),sr)},tiles:{1:shuffle(tiles.t1,sr),2:shuffle(tiles.t2,sr)},market:{1:[],2:[]},phaseChoices:[],selectedPhases:[],activePlayer:0,history:[],aiVersion:'heuristic-v0.6c',setupDone:false,setupBusy:false};refillMarket(1);refillMarket(2);document.getElementById('log').textContent='';log(`新遊戲：seed=${seed}`);render();document.getElementById('status').textContent='尚未完成起始術式設定'}catch(err){S=null;showError(err);console.error('newGame failed',err)}}
function draw(deck,n){return deck.splice(0,Math.min(n,deck.length))} function bottom(deck,cards){deck.push(...cards)}
function refillMarket(t){while(S.market[t].length<3&&S.tiles[t].length)S.market[t].push(S.tiles[t].shift())}
function showError(err){const b=document.getElementById('errorBox');b.style.display='block';b.textContent='發生錯誤：'+(err?.message||String(err));console.error(err)}
function clearError(){const b=document.getElementById('errorBox');if(b){b.style.display='none';b.textContent=''}}
async function ensureSetup(){if(S.setupDone)return true;if(S.setupBusy)return false;S.setupBusy=true;clearError();try{S.phase='setup';render();await initialSpells();S.setupDone=true;S.phase='idle';snapshot('game_start');log('起始術式設定完成');render();return true}catch(err){S.phase='idle';showError(err);render();return false}finally{S.setupBusy=false}}
async function initialSpells(){for(const p of S.players){const tier=p.human?await chooseTier('選擇起始術式 Tier'):aiTier(p);const cards=draw(S.spells[tier],2);let idx=p.human?await chooseCards(`選擇 ${p.name} 的起始術式`,cards,1):aiChooseSpell(p,cards);const chosen=cards[idx];p.spells.push({card:chosen,level:1,used:false});bottom(S.spells[tier],cards.filter((_,i)=>i!==idx));log(`${p.name} 起始術式：${chosen.name}`,{type:'study',player:p.id,mode:'initial',seen:cards.map(c=>c.id),selected:chosen.id})}}
function aiTier(p){const prod=productionProfile(p);let base=BASE.reduce((s,e)=>s+prod[e],0),adv=ADV.reduce((s,e)=>s+prod[e],0);return adv>base*.45?2:1}
function costText(c){return Object.entries(c).map(([e,n])=>`${EM[e]}×${n}`).join(' + ')}
function rewardText(r){return `${r.gold?`${r.gold}G`:''}${r.gold&&r.vp?'+':''}${r.vp?`${r.vp}VP`:''}`}
function canPay(p,c){return Object.entries(c).every(([e,n])=>p.res[e]>=n)}
function spellValue(p,c){let best=0;for(let lv=1;lv<=3;lv++)for(const r of c.recipes[lv]||[]){let fit=0;for(const[e,n]of Object.entries(r.cost))fit+=Math.min(p.res[e],n)/n;const ev=r.reward.gold/2+r.reward.vp;best=Math.max(best,fit+ev*.35)}const prod=productionProfile(p);let future=0;for(const lv of [1,2,3])for(const r of c.recipes[lv]||[])for(const e of Object.keys(r.cost))future+=prod[e]*.08;return best+future}
function aiChooseSpell(p,cards){let best=0,v=-1e9;cards.forEach((c,i)=>{const x=spellValue(p,c)+rng()*.12;if(x>v){v=x;best=i}});return best}
function snapshot(reason){S.history.push({reason,round:S.round,players:S.players.map(p=>({id:p.id,gold:p.gold,vp:p.vp,res:clone(p.res),spells:p.spells.map(s=>({id:s.card.id,level:s.level,used:s.used})),hand:p.hand.map(t=>t.id),board:clone(p.board),production:productionProfile(p)}))})}
function productionProfile(p){const out=Object.fromEntries([...BASE,...ADV].map(e=>[e,0]));for(const [k,t] of Object.entries(p.board)){if(t.type==='center'){const[q,r]=k.split(',').map(Number);for(const[dq,dr]of DIR){const n=p.board[key(q+dq,r+dr)];if(n?.type==='element')out[n.element]++}} else if(t.type==='production'){const[q,r]=k.split(',').map(Number), [a,b]=PARENTS[t.element];let ca=0,cb=0;for(const[dq,dr]of DIR){const n=p.board[key(q+dq,r+dr)];if(n?.type==='element'){if(n.element===a)ca++;if(n.element===b)cb++}}out[t.element]+=Math.min(ca,cb)}}return out}
function legalPlacements(p,t){return hexCoords().filter(h=>!p.board[key(h.q,h.r)]&&legalAt(p,t,h.q,h.r))}
function legalAt(p,t,q,r){if(t.type==='production')return true;const existing=Object.entries(p.board).filter(([_,x])=>x.type==='element'&&x.element===t.element);if(existing.length===0)return true;return DIR.some(([dq,dr])=>p.board[key(q+dq,r+dr)]?.type==='element'&&p.board[key(q+dq,r+dr)]?.element===t.element)}
function buildCost(p,t){const disc=(S.phase==='Build'&&p.choice?.privilege==='Discount')?1:0;return Math.max(0,t.cost-disc)}
function buildTile(p,t,q,r){const c=buildCost(p,t);if(p.gold<c||!legalAt(p,t,q,r)||p.board[key(q,r)])return false;p.gold-=c;p.board[key(q,r)]=clone(t);if(t.type==='element')p.res[t.element]++;log(`${p.name} 建造 ${t.name} @ ${q},${r} (-${c}G)`,{type:'build',player:p.id,tile:t.id,cost:c,hex:[q,r],productionAfter:productionProfile(p)});return true}
function aiPlaceScore(p,t,h){const temp=clone(p.board);p.board[key(h.q,h.r)]=clone(t);const after=productionProfile(p);p.board=temp;let gain=Object.values(after).reduce((a,b)=>a+b,0)-Object.values(productionProfile(p)).reduce((a,b)=>a+b,0);let spell=0;for(const s of p.spells)for(const rr of s.card.recipes[Math.min(3,s.level+1)]||[])if(rr.cost[t.element])spell+=.4;return gain*3+spell+rng()}
function aiBuildFromHand(p){let changed=true;while(changed){changed=false;let best=null,bv=.2;for(let i=0;i<p.hand.length;i++){const t=p.hand[i], c=buildCost(p,t);if(c>p.gold)continue;const ls=legalPlacements(p,t);for(const h of ls){const v=aiPlaceScore(p,t,h)-c*.45;if(v>bv){bv=v;best={i,t,h}}}}if(best){buildTile(p,best.t,best.h.q,best.h.r);p.hand.splice(best.i,1);changed=true}}}
function aiAcquire(p){const opts=[...S.market[1].map((t,i)=>({t,tier:1,i})),...S.market[2].map((t,i)=>({t,tier:2,i}))];let best=null,bv=-1e9;for(const o of opts){if(p.hand.length>=3&&!(p.gold>=buildCost(p,o.t)&&legalPlacements(p,o.t).length))continue;const h=legalPlacements(p,o.t);if(!h.length)continue;let v=Math.max(...h.map(x=>aiPlaceScore(p,o.t,x)))-(o.t.cost*.22);if(v>bv){bv=v;best=o}}if(!best)return;S.market[best.tier].splice(best.i,1);refillMarket(best.tier);if(p.hand.length<3){p.hand.push(best.t);log(`${p.name} 取得 ${best.t.name}`,{type:'acquire',player:p.id,tile:best.t.id,tier:best.tier})}else{const h=legalPlacements(p,best.t).sort((a,b)=>aiPlaceScore(p,best.t,b)-aiPlaceScore(p,best.t,a))[0];buildTile(p,best.t,h.q,h.r)}}
function activate(p,si,ri,lv){const s=p.spells[si],r=s.card.recipes[lv][ri];if(s.used||lv>s.level||!canPay(p,r.cost))return false;const before=clone(p.res);for(const[e,n]of Object.entries(r.cost))p.res[e]-=n;p.gold+=r.reward.gold;p.vp+=r.reward.vp;s.used=true;log(`${p.name} 發動 ${s.card.name} Lv${lv}: ${costText(r.cost)} → ${rewardText(r.reward)}`,{type:'spell_activation',player:p.id,spell:s.card.id,level:s.level,recipeLevel:lv,cost:r.cost,reward:r.reward,before,after:clone(p.res)});return true}
function aiCast(p){for(let z=0;z<5;z++){let best=null,bv=0;for(let i=0;i<p.spells.length;i++){const s=p.spells[i];if(s.used)continue;for(let lv=1;lv<=s.level;lv++)for(let ri=0;ri<(s.card.recipes[lv]||[]).length;ri++){const r=s.card.recipes[lv][ri];if(!canPay(p,r.cost))continue;const v=r.reward.vp+r.reward.gold*(p.gold<5?.65:.35)+Object.values(r.cost).reduce((a,b)=>a+b,0)*.08;if(v>bv){bv=v;best={i,ri,lv}}}}if(best)activate(p,best.i,best.ri,best.lv);else break}}
function aiChoice(p){const prod=productionProfile(p), total=Object.values(prod).reduce((a,b)=>a+b,0);const up=p.spells.filter(s=>s.level<3).length;const values={Funding:(p.gold<4?6:1)+rng(),Build:(p.gold>=2?4:1)+total*.3+rng(),Study:2+p.spells.length<3?3:1,Production:total*1.1+rng()}; values.Study=(p.spells.length<3?5:2)+total*.3+rng();let phase=Object.entries(values).sort((a,b)=>b[1]-a[1])[0][0];let privilege='';if(phase==='Funding')privilege=p.hand.length<3&&rng()<.25?'Procurement':'Financing';if(phase==='Build')privilege=p.gold<5?'Discount':'Expansion';if(phase==='Study')privilege=up&&p.spells.length>=2&&rng()<.45?'Upgrade':'Search';if(phase==='Production')privilege='Proliferation';return {phase,privilege,scores:values}}
async async function choosePhase(){const body=document.createElement('div');const privs={Funding:['Financing','Procurement'],Build:['Expansion','Discount'],Study:['Search','Upgrade'],Production:['Proliferation']};let ph='Funding',priv='Financing';body.innerHTML=`<div class="choicegrid">${PHASES.map(p=>`<div class="choice" data-ph="${p}"><b>${p}</b><div class="priv"></div></div>`).join('')}</div>`;function selectPhase(selectedPhase,selectedPriv){ph=selectedPhase;priv=selectedPriv;const canUp=S.players[0].spells.some(s=>s.level<3);body.querySelectorAll('.choice').forEach(el=>{const isSelected=el.dataset.ph===selectedPhase;el.classList.toggle('selected',isSelected);const list=privs[el.dataset.ph];el.querySelector('.priv').innerHTML=list.map(x=>`<label style="display:block;margin-top:7px"><input type="radio" name="pv-${el.dataset.ph}" value="${x}" ${isSelected&&x===selectedPriv?'checked':''} ${x==='Upgrade'&&!canUp?'disabled':''}> ${x}</label>`).join('');el.querySelector('.priv').onclick=e=>e.stopPropagation();el.querySelectorAll('input').forEach(i=>i.onchange=()=>selectPhase(el.dataset.ph,i.value));});}body.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{const phase=el.dataset.ph;selectPhase(phase,privs[phase][0]);});selectPhase('Funding','Financing');return await modal('選擇 Phase + Privilege',body,()=>({phase:ph,privilege:priv}))}
async function runRound(){if(!S){showError(new Error('遊戲尚未成功初始化，請先按「新遊戲」'));return}if(!S.setupDone){const ok=await ensureSetup();if(!ok)return}if(S.phase!=='idle')return;clearError();try{S.players.forEach(p=>p.spells.forEach(s=>s.used=false));S.players[0].choice=await choosePhase();S.players.slice(1).forEach(p=>p.choice=aiChoice(p));S.phaseChoices=S.players.map(p=>({player:p.id,...p.choice}));S.selectedPhases=PHASES.filter(ph=>S.players.some(p=>p.choice.phase===ph));log('Phase reveal',{type:'phase_choices',choices:clone(S.phaseChoices)});render();for(const ph of PHASES)if(S.selectedPhases.includes(ph)){S.phase=ph;render();if(ph==='Funding')await resolveFunding();if(ph==='Build')await resolveBuild();if(ph==='Study')await resolveStudy();if(ph==='Production')await resolveProduction();S.players.slice(1).forEach(aiCast);render()}S.phase='round_end';snapshot('round_end');log(`Round ${S.round} 結束`);if(S.round>=8){S.phase='ended';render();return}S.round++;S.phase='idle';render()}catch(err){S.phase='idle';showError(err);render()}}
async function resolveFunding(){S.players.forEach(p=>{p.gold+=2;if(p.choice.phase==='Funding'&&p.choice.privilege==='Financing')p.gold+=3});for(const p of S.players){if(p.choice.phase==='Funding'&&p.choice.privilege==='Procurement'&&p.hand.length<3){const tier=p.human?await chooseTier('採購：選擇 T1/T2'):aiTier(p);const cards=draw(S.tiles[tier],3);if(cards.length){let idx=p.human?await chooseTileCards('採購：看 3 取 1',cards):0;p.hand.push(cards[idx]);bottom(S.tiles[tier],shuffle(cards.filter((_,i)=>i!==idx)));log(`${p.name} 採購 ${cards[idx].name}`,{type:'procurement',player:p.id,tier,seen:cards.map(x=>x.id),selected:cards[idx].id})}}}log('Funding resolved')}
async function resolveBuild(){for(const p of S.players)if(p.choice.phase==='Build'&&p.choice.privilege==='Expansion')await acquisition(p);for(const p of S.players)if(!(p.choice.phase==='Build'&&p.choice.privilege==='Expansion'))await acquisition(p);for(const p of S.players)if(p.choice.phase==='Build'&&p.choice.privilege==='Expansion')await acquisition(p);for(const p of S.players){if(p.human){render();await humanBuildWindow()}else aiBuildFromHand(p)}log('Build resolved')}
async function acquisition(p){if(p.human){await humanAcquire()} else {aiAcquire(p)}}
async function humanAcquire(){const p=S.players[0];const opts=[...S.market[1].map((t,i)=>({t,tier:1,i})),...S.market[2].map((t,i)=>({t,tier:2,i}))];const body=document.createElement('div');body.innerHTML='<div class="choicegrid"></div>';const grid=body.firstChild;let sel=null;opts.forEach(o=>{const legal=legalPlacements(p,o.t).length>0;const handOK=p.hand.length<3||(p.gold>=buildCost(p,o.t)&&legal);const d=document.createElement('div');d.className='choice';d.innerHTML=`<b>${o.t.name}</b><div>Tier ${o.tier}｜建造 ${o.t.cost}G</div><div class="muted">${legal?'有合法位置':'無合法位置'}</div>`;if(handOK&&legal)d.onclick=()=>{grid.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');sel=o};else d.style.opacity=.4;grid.appendChild(d)});const res=await modal('Build：公開取得 1 張（可取消=pass）',body,()=>sel,true);if(!res)return;const o=res;S.market[o.tier].splice(o.i,1);refillMarket(o.tier);if(p.hand.length<3){p.hand.push(o.t);log(`你取得 ${o.t.name}`,{type:'acquire',player:0,tile:o.t.id})}else{buildSelection=o.t;render();await placeSelectedFromMarket(o.t)}}
async function placeSelectedFromMarket(t){return new Promise(resolve=>{modalResolve={marketImmediate:true,tile:t,resolve};document.getElementById('status').textContent=`立刻建造 ${t.name}`;render()})}
async function humanBuildWindow(){if(!S.players[0].hand.length)return;await modal('Build：從手牌建造',Object.assign(document.createElement('div'),{innerHTML:'<p>關閉這個視窗後，可點選下方手牌，再點綠色合法 Hex 建造。完成所有想建的板塊後，按「完成 Build」。</p><button class="secondary" id="goBuild">開始放置</button>'}),()=>true);return new Promise(resolve=>{const b=document.createElement('button');b.textContent='完成 Build';b.className='primary';b.id='finishBuild';b.style.position='fixed';b.style.right='18px';b.style.bottom='18px';b.style.zIndex='30';b.onclick=()=>{b.remove();buildSelection=null;render();resolve()};document.body.appendChild(b);render()})}
async function resolveStudy(){for(const p of S.players){const isSel=p.choice.phase==='Study';if(isSel&&p.choice.privilege==='Upgrade'){const ups=p.spells.map((s,i)=>({s,i})).filter(x=>x.s.level<3);if(!ups.length)continue;let idx=p.human?await chooseUpgrade(p,ups):ups.sort((a,b)=>spellValue(p,b.s.card)-spellValue(p,a.s.card))[0].i;const s=p.spells[idx],before=s.level;s.level++;log(`${p.name} 升級 ${s.card.name} Lv${before}→Lv${s.level}`,{type:'upgrade',player:p.id,spell:s.card.id,before,after:s.level});continue}const tier=p.human?await chooseTier(`${p.name} Study：指定 Tier`):aiTier(p);const n=isSel&&p.choice.privilege==='Search'?4:2;const cards=draw(S.spells[tier],n);if(!cards.length)continue;const idx=p.human?await chooseCards(`${n===4?'Search 4取1':'Normal 2取1'}`,cards,1):aiChooseSpell(p,cards);const chosen=cards[idx];p.spells.push({card:chosen,level:1,used:false});bottom(S.spells[tier],cards.filter((_,i)=>i!==idx));log(`${p.name} Study 取得 ${chosen.name}`,{type:'study',player:p.id,mode:n===4?'search':'normal',tier,seen:cards.map(c=>c.id),selected:chosen.id,production:productionProfile(p)})}log('Study resolved')}
async function resolveProduction(){for(const p of S.players){doProduction(p,'free',0);const sel=p.choice.phase==='Production';if(sel){doProduction(p,'privilege',0);if(p.human){if(await yesNo('Production：是否支付 7G 進行第二次增殖？',p.gold>=7)){p.gold-=7;doProduction(p,'proliferation2',7)}}else if(p.gold>=7&&Object.values(productionProfile(p)).reduce((a,b)=>a+b,0)>=4&&rng()<.45){p.gold-=7;doProduction(p,'proliferation2',7)}}else{if(p.human){if(await yesNo('Production：是否支付 4G 進行第一次增殖？',p.gold>=4)){p.gold-=4;doProduction(p,'proliferation1',4);if(await yesNo('是否再支付 7G 進行第二次增殖？',p.gold>=7)){p.gold-=7;doProduction(p,'proliferation2',7)}}}else{const tot=Object.values(productionProfile(p)).reduce((a,b)=>a+b,0);if(p.gold>=4&&tot>=3&&rng()<.5){p.gold-=4;doProduction(p,'proliferation1',4);if(p.gold>=7&&tot>=5&&rng()<.3){p.gold-=7;doProduction(p,'proliferation2',7)}}}}}log('Production resolved')}
function doProduction(p,kind,cost){const prof=productionProfile(p);for(const[e,n]of Object.entries(prof))p.res[e]+=n;log(`${p.name} Production ${kind}: ${Object.entries(prof).filter(x=>x[1]).map(([e,n])=>`${EM[e]}+${n}`).join(', ')||'0'}`,{type:'production',player:p.id,kind,cost,total:prof})}

function render(){if(!S)return;document.getElementById('round').textContent=S.round;document.getElementById('seedLabel').textContent=S.seed;const status=S.phase==='idle'?(S.setupDone?'等待選擇 Phase':'等待起始術式設定'):(S.phase==='setup'?'起始術式設定中':S.phase==='ended'?'測試結束':S.phase);document.getElementById('status').textContent=status;const sb=document.getElementById('startRound');sb.disabled=!(S.phase==='idle');sb.textContent=S.setupDone?'選擇本回合 Phase':'設定起始術式並開始';document.getElementById('phasebar').innerHTML=PHASES.map(ph=>`<span class="phase ${S.selectedPhases.includes(ph)?'on':''} ${S.phase===ph?'now':''}">${ph}</span>`).join('');document.getElementById('reveals').innerHTML=S.phaseChoices.length?S.players.map(p=>`${p.name}: <b>${p.choice?.phase||'-'}</b> / ${p.choice?.privilege||'-'}`).join('　'):'尚未揭露本回合選擇';renderPlayers();renderBoard();renderMarketHand()}
function renderPlayers(){document.getElementById('players').innerHTML=S.players.map(p=>{const prof=productionProfile(p);return `<div class="player ${p.human?'me':''}"><h3>${p.name}</h3><div class="stats"><b>${p.gold}G</b><b>${p.vp}VP</b><span>術式 ${p.spells.length}</span><span>手牌 ${p.hand.length}/3</span></div><div class="resources">${[...BASE,...ADV].map(e=>`<div class="res">${EM[e]} <b>${p.res[e]}</b> <small>(+${prof[e]})</small></div>`).join('')}</div><div class="spells">${p.spells.map((s,i)=>spellHtml(p,s,i)).join('')||'<span class="muted">尚無術式</span>'}</div></div>`}).join('');document.querySelectorAll('[data-cast]').forEach(btn=>btn.onclick=()=>castUi(Number(btn.dataset.p),Number(btn.dataset.cast)))}
function spellHtml(p,s,i){let rs='';for(let lv=1;lv<=3;lv++){const arr=s.card.recipes[lv]||[];rs+=`<div class="recipe ${lv>s.level?'lock':''}">Lv${lv}: ${arr.map(r=>`${costText(r.cost)} → ${rewardText(r.reward)}`).join(' / ')}</div>`}return `<div class="spell ${s.used?'used':''}"><div class="title"><span>${s.card.name}</span><span>Lv${s.level}</span></div>${rs}${p.human?`<button data-p="${p.id}" data-cast="${i}" ${s.used?'disabled':''}>${s.used?'本回合已發動':'發動'}</button>`:''}</div>`}
function renderMarketHand(){for(const t of [1,2])document.getElementById(`market${t}`).innerHTML=S.market[t].map(x=>`<div class="tilecard"><b>${x.name}</b><div>建造費 ${x.cost}G</div></div>`).join('');const p=S.players[0];document.getElementById('handCount').textContent=p.hand.length;document.getElementById('hand').innerHTML=p.hand.map((t,i)=>`<button class="mini" data-hand="${i}">${t.name} (${buildCost(p,t)}G)</button>`).join('');document.querySelectorAll('[data-hand]').forEach(b=>b.onclick=()=>{if(S.phase!=='Build')return;buildSelection=p.hand[Number(b.dataset.hand)];renderBoard()})}
function renderBoard(){const el=document.getElementById('board'),p=S.players[0];el.innerHTML='';const W=610,H=570, size=42;for(const h of hexCoords()){const x=W/2+Math.sqrt(3)*size*(h.q+h.r/2)-Math.sqrt(3)*size/2;const y=H/2+1.5*size*h.r-size;const t=p.board[key(h.q,h.r)];const b=document.createElement('button');b.className='hex';b.style.left=x+'px';b.style.top=y+'px';b.dataset.q=h.q;b.dataset.r=h.r;if(t){b.classList.add('occupied');if(t.type==='center'){b.classList.add('center');b.textContent='元素\n汲取井'}else if(t.type==='element'){b.classList.add(t.element);b.textContent=EM[t.element]}else{b.classList.add('prod');b.textContent=t.name}}else if(buildSelection&&legalAt(p,buildSelection,h.q,h.r)&&p.gold>=buildCost(p,buildSelection)){b.classList.add('legal');b.textContent='可建造';b.onclick=()=>placeHuman(h.q,h.r)}else b.textContent=`${h.q},${h.r}`;el.appendChild(b)}}
function placeHuman(q,r){const p=S.players[0],t=buildSelection;if(!t)return;if(buildTile(p,t,q,r)){const hi=p.hand.findIndex(x=>x.id===t.id);if(hi>=0)p.hand.splice(hi,1);if(modalResolve?.marketImmediate){const rsl=modalResolve.resolve;modalResolve=null;buildSelection=null;render();rsl();return}buildSelection=null;render()}}
async function castUi(pid,si){const p=S.players[pid],s=p.spells[si];const choices=[];for(let lv=1;lv<=s.level;lv++)for(let ri=0;ri<s.card.recipes[lv].length;ri++){const r=s.card.recipes[lv][ri];if(canPay(p,r.cost))choices.push({lv,ri,r})}if(!choices.length){alert('目前沒有可支付的已解鎖配方');return}const body=document.createElement('div');body.innerHTML='<div class="choicegrid"></div>';let sel=null;for(const c of choices){const d=document.createElement('div');d.className='choice';d.innerHTML=`<b>Lv${c.lv}</b><div>${costText(c.r.cost)} → ${rewardText(c.r.reward)}</div>`;d.onclick=()=>{body.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');sel=c};body.firstChild.appendChild(d)}const x=await modal(`發動 ${s.card.name}`,body,()=>sel);if(x){activate(p,si,x.ri,x.lv);render()}}

function modal(title,body,getValue,allowCancel=false){return new Promise(resolve=>{const m=document.getElementById('modal');document.getElementById('modalTitle').textContent=title;const mb=document.getElementById('modalBody');mb.innerHTML='';mb.appendChild(body);m.classList.add('show');const c=document.getElementById('modalConfirm'),x=document.getElementById('modalCancel');x.style.display=allowCancel?'inline-block':'none';c.onclick=()=>{const v=getValue();if(v==null)return;m.classList.remove('show');resolve(v)};x.onclick=()=>{m.classList.remove('show');resolve(null)}})}
function chooseTier(title){const d=document.createElement('div');d.innerHTML='<label><input type="radio" name="tier" value="1" checked> T1</label>　<label><input type="radio" name="tier" value="2"> T2</label>';return modal(title,d,()=>Number(d.querySelector('input:checked').value))}
function chooseCards(title,cards){const d=document.createElement('div');d.innerHTML='<div class="choicegrid"></div>';let sel=null;cards.forEach((c,i)=>{const e=document.createElement('div');e.className='choice';e.innerHTML=`<b>${c.name}</b>${[1,2,3].map(l=>`<div class="recipe">Lv${l}: ${(c.recipes[l]||[]).map(r=>`${costText(r.cost)} → ${rewardText(r.reward)}`).join(' / ')}</div>`).join('')}`;e.onclick=()=>{d.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');sel=i};d.firstChild.appendChild(e)});return modal(title,d,()=>sel)}
function chooseTileCards(title,cards){const d=document.createElement('div');d.innerHTML='<div class="choicegrid"></div>';let sel=null;cards.forEach((c,i)=>{const e=document.createElement('div');e.className='choice';e.innerHTML=`<b>${c.name}</b><div>建造 ${c.cost}G</div>`;e.onclick=()=>{d.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');sel=i};d.firstChild.appendChild(e)});return modal(title,d,()=>sel)}
function chooseUpgrade(p,ups){const d=document.createElement('div');d.innerHTML='<div class="choicegrid"></div>';let sel=null;ups.forEach(({s,i})=>{const e=document.createElement('div');e.className='choice';e.innerHTML=`<b>${s.card.name}</b><div>Lv${s.level} → Lv${s.level+1}</div><div class="recipe">新增：${s.card.recipes[s.level+1].map(r=>`${costText(r.cost)} → ${rewardText(r.reward)}`).join(' / ')}</div>`;e.onclick=()=>{d.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');sel=i};d.firstChild.appendChild(e)});return modal('選擇要升級的術式',d,()=>sel)}
function yesNo(title,enabled){if(!enabled)return Promise.resolve(false);const d=document.createElement('div');d.innerHTML='<p>要執行嗎？</p><label><input type="radio" name="yn" value="1" checked> 是</label>　<label><input type="radio" name="yn" value="0"> 否</label>';return modal(title,d,()=>d.querySelector('input:checked').value==='1')}

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){if(!S)throw new Error('遊戲尚未成功初始化，請先按「新遊戲」');const out={build:'Integration Alpha v0.6 prototype-c',seed:S.seed,seedHash:S.seedHash,aiVersion:S.aiVersion,round:S.round,logs:S.logs,history:S.history,final:S.players.map(p=>({name:p.name,gold:p.gold,vp:p.vp,res:p.res,spells:p.spells.map(s=>({id:s.card.id,level:s.level})),board:p.board}))};download(`element_pipeline_${S.seed}.json`,JSON.stringify(out,null,2),'application/json')}
function exportCSV(){if(!S)throw new Error('遊戲尚未成功初始化，請先按「新遊戲」');const rows=[['round','type','player','message','gold','vp']];for(const h of S.history.filter(x=>x.reason==='round_end'))for(const p of h.players)rows.push([h.round,'snapshot',p.id,'round_end',p.gold,p.vp]);const csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n');download(`element_pipeline_${S.seed}_summary.csv`,csv,'text/csv;charset=utf-8')}

document.getElementById('newGame').onclick=()=>newGame(document.getElementById('seedInput').value||'alpha-v06');document.getElementById('startRound').onclick=()=>runRound().catch(showError);document.getElementById('exportJson').onclick=()=>{try{exportJSON()}catch(e){showError(e)}};document.getElementById('exportCsv').onclick=()=>{try{exportCSV()}catch(e){showError(e)}};
newGame('alpha-v06');
})();
</script>
